<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عطور الشرق | متجر العطور الفاخرة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .cart-open { transform: translateX(0) !important; }
        .overlay { display: none; }
        .overlay.active { display: block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 relative">

    <!-- شريط التنقل -->
    <nav class="bg-black text-white p-4 sticky top-0 z-40 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-yellow-500">عطور الشرق</h1>
            <div class="flex space-x-4 space-x-reverse items-center cursor-pointer bg-gray-800 px-4 py-2 rounded-full hover:bg-gray-700 transition" onclick="toggleCart()">
                <span class="text-xl">🛒</span>
                <span id="cart-count" class="bg-yellow-500 text-black px-2 py-0.5 rounded-full text-xs font-bold">0</span>
            </div>
        </div>
    </nav>

    <!-- البانر الرئيسي -->
    <header class="bg-black text-white text-center py-20 px-4 border-b-4 border-yellow-500">
        <h2 class="text-4xl md:text-5xl font-bold mb-4">اكتشف عطرك المميز</h2>
        <p class="text-gray-400 text-lg mb-8">أفخم العطور الشرقية والفرنسية بين يديك</p>
        <button onclick="document.getElementById('products-grid').scrollIntoView({behavior: 'smooth'})" class="bg-yellow-500 text-black px-8 py-3 rounded-full font-bold hover:bg-yellow-400 transition text-lg">تسوق الآن</button>
    </header>

    <!-- المنتجات -->
    <main class="container mx-auto py-12 px-4" id="products-section">
        <h3 class="text-2xl font-bold mb-8 text-center border-b-2 border-yellow-500 inline-block pb-2">الأكثر مبيعاً</h3>
        
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8 mt-8">
            <p class="text-center col-span-3 text-gray-500 text-xl">جاري تحميل العطور...</p>
        </div>
    </main>

    <!-- طبقة تعتيم الخلفية -->
    <div id="overlay" class="overlay fixed inset-0 bg-black bg-opacity-50 z-40" onclick="toggleCart()"></div>

    <!-- السلة الجانبية -->
    <div id="cart-sidebar" class="fixed inset-y-0 left-0 w-80 md:w-96 bg-white shadow-2xl transform -translate-x-full transition-transform duration-300 z-50 flex flex-col">
        <div class="p-4 bg-black text-white flex justify-between items-center">
            <h3 class="text-xl font-bold">سلة المشتريات</h3>
            <button onclick="toggleCart()" class="text-3xl leading-none hover:text-yellow-500">&times;</button>
        </div>
        
        <div id="cart-items" class="flex-1 p-4 overflow-y-auto">
            <p class="text-center text-gray-500 mt-10">السلة فارغة</p>
        </div>
        
        <div class="p-4 border-t bg-gray-50">
            <div class="flex justify-between font-bold text-lg mb-4 text-black">
                <span>الإجمالي:</span>
                <span id="cart-total" class="text-yellow-600">0 ج.م</span>
            </div>
            <button onclick="checkout()" class="w-full bg-black text-white font-bold py-3 rounded hover:bg-gray-800 transition">إتمام الطلب (الدفع عند الاستلام)</button>
        </div>
    </div>

    <!-- الفوتر -->
    <footer class="bg-black text-center text-gray-500 py-6 mt-12">
        <p>جميع الحقوق محفوظة &copy; 2024 عطور الشرق</p>
    </footer>

    <!-- سكربت الجافاسكريبت -->
    <script>
        // ✅ مفاتيح Supabase بتاعتك
        const SUPABASE_URL = 'https://icmvrjmkcyjuoxekvvfw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_M05JYZ9LKlIfeDjuCJqzxQ_Ay6EbRKj';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        // 1. سحب المنتجات من الداتابيز
        async function fetchProducts() {
            const { data: products, error } = await supabaseClient.from('products').select('*');
            
            if (error) {
                console.error('Error fetching:', error);
                document.getElementById('products-grid').innerHTML = '<p class="text-center col-span-3 text-red-500">حدث خطأ في تحميل المنتجات.</p>';
                return;
            }

            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            if (products.length === 0) {
                grid.innerHTML = '<p class="text-center col-span-3 text-gray-500">لا توجد منتجات حالياً.</p>';
                return;
            }

            products.forEach(product => {
                grid.innerHTML += `
                    <div class="bg-white rounded-lg shadow-lg overflow-hidden hover:shadow-2xl transition duration-300 transform hover:-translate-y-1">
                        <img src="${product.image_url}" alt="${product.name}" class="w-full h-64 object-cover">
                        <div class="p-5">
                            <div class="flex justify-between items-start mb-2">
                                <h4 class="text-xl font-bold text-gray-900">${product.name}</h4>
                                <span class="text-sm text-gray-500 bg-gray-100 px-2 py-1 rounded">${product.brand}</span>
                            </div>
                            <p class="text-gray-600 text-sm mb-4 leading-relaxed">${product.notes}</p>
                            <div class="flex justify-between items-center mt-4 border-t pt-4">
                                <span class="text-yellow-600 font-bold text-xl">${product.price} ج.م</span>
                                <button onclick="addToCart(${product.id}, '${product.name}', ${product.price})" class="bg-black text-white px-5 py-2 rounded-lg hover:bg-yellow-500 hover:text-black transition font-bold">أضف للسلة</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // 2. وظائف السلة
        function addToCart(id, name, price) {
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ id, name, price, qty: 1 });
            }
            saveCart();
            if (!document.getElementById('cart-sidebar').classList.contains('cart-open')) {
                toggleCart(); 
            }
        }

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            // تحديث العداد
            const totalCount = cart.reduce((total, item) => total + item.qty, 0);
            document.getElementById('cart-count').innerText = totalCount;
            
            const cartItemsDiv = document.getElementById('cart-items');
            let totalPrice = 0;

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p class="text-center text-gray-500 mt-10">السلة فارغة</p>';
                document.getElementById('cart-total').innerText = '0 ج.م';
                return;
            }

            cartItemsDiv.innerHTML = '';
            cart.forEach((item, index) => {
                totalPrice += item.price * item.qty;
                cartItemsDiv.innerHTML += `
                    <div class="flex justify-between items-center border-b border-gray-200 pb-3 mb-3">
                        <div class="flex-1">
                            <p class="font-bold text-gray-800">${item.name}</p>
                            <p class="text-sm text-gray-500">${item.price} ج.م × ${item.qty}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 text-sm font-bold bg-red-50 px-2 py-1 rounded">حذف</button>
                    </div>
                `;
            });

            document.getElementById('cart-total').innerText = totalPrice + ' ج.م';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
        }

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('overlay');
            
            if (sidebar.classList.contains('cart-open')) {
                sidebar.classList.remove('cart-open');
                overlay.classList.remove('active');
            } else {
                sidebar.classList.add('cart-open');
                overlay.classList.add('active');
            }
        }

        // 3. إتمام الطلب وحفظه في Supabase
        async function checkout() {
            if (cart.length === 0) return alert('السلة فارغة! أضف بعض العطور أولاً.');
            
            const name = prompt('ادخل اسمك بالكامل:');
            if (!name || name.trim() === '') return;
            
            const phone = prompt('ادخل رقم تليفونك:');
            if (!phone || phone.trim() === '') return;

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            // إظهار مؤشر تحميل (اختياري)
            const checkoutBtn = document.querySelector('button[onclick="checkout()"]');
            const originalText = checkoutBtn.innerText;
            checkoutBtn.innerText = 'جاري تأكيد الطلب...';
            checkoutBtn.disabled = true;

            // حفظ الطلب في Supabase
            const { data, error } = await supabaseClient
                .from('orders')
                .insert([
                    { 
                        customer_name: name, 
                        phone: phone, 
                        total_price: totalPrice, 
                        items: cart 
                    }
                ]);

            if (error) {
                console.error('Error saving order:', error);
                alert('حدث خطأ أثناء حفظ الطلب. يرجى المحاولة مرة أخرى.');
                checkoutBtn.innerText = originalText;
                checkoutBtn.disabled = false;
                return;
            }

            // نجاح
            alert(`شكراً لك يا ${name}!\nتم استلام طلبك بنجاح بإجمالي ${totalPrice} ج.م.\nسيتم التواصل معك قريباً على ${phone}.`);
            
            // تفريغ السلة
            cart = [];
            saveCart();
            toggleCart();
            
            // إرجاع الزرار لحالته
            checkoutBtn.innerText = originalText;
            checkoutBtn.disabled = false;
        }

        // تشغيل الدوال أول ما الصفحة تفتح
        fetchProducts();
        updateCartUI();
    </script>
</body>
</html>
