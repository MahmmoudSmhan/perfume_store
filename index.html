<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO Meta Tags -->
    <title>عطور الشرق | الفخامة والتميز</title>
    <meta name="description" content="اشتري أفخم العطور الشرقية والفرنسية الأصلية بأفضل الأسعار من عطور الشرق.">
    <meta property="og:title" content="عطور الشرق | الفخامة والتميز">
    <meta property="og:description" content="اكتشف عطرك المميز من مجموعتنا الفاخرة.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1616949755610-8c9bbc08f138?q=80&w=2070&auto=format&fit=crop">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { gold: '#D4AF37', dark: '#0a0a0a', darker: '#050505', card: '#111111' },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'], amiri: ['Amiri', 'serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0a0a0a; color: #f3f4f6; }
        .gold-text { font-family: 'Amiri', serif; color: #D4AF37; }
        .cart-open { transform: translateX(0) !important; }
        .modal-open { opacity: 1 !important; pointer-events: auto !important; }
        .modal-content { transform: translateY(0) !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 4px; }
    </style>
</head>
<body class="relative min-h-screen flex flex-col">

    <!-- شريط التنقل -->
    <nav class="bg-darker bg-opacity-90 backdrop-blur-md text-white p-4 sticky top-0 z-40 border-b border-gray-800">
        <div class="container mx-auto flex justify-between items-center">
            <h1 id="site-name" class="text-3xl font-bold gold-text tracking-wide hidden md:block">عطور الشرق</h1>
            <div class="flex items-center gap-4 flex-1 mx-4 md:mx-10">
                <div class="relative w-full max-w-md">
                    <input type="text" id="search-input" placeholder="ابحث عن عطرك..." class="w-full bg-gray-900 text-white border border-gray-700 rounded-full py-2 px-4 focus:outline-none focus:border-gold transition">
                    <i class="fa-solid fa-search absolute left-4 top-3 text-gray-500"></i>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div class="relative cursor-pointer group" onclick="toggleCart()">
                    <span class="text-2xl group-hover:text-gold transition">🛒</span>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-gold text-black text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full">0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- البانر -->
    <header class="relative bg-darker text-center py-20 px-4 overflow-hidden">
        <div id="hero-bg" class="absolute inset-0 bg-cover bg-center opacity-20"></div>
        <div class="relative z-10">
            <h2 id="hero-title" class="text-5xl md:text-7xl font-bold mb-6 gold-text drop-shadow-lg">اكتشف عطرك المميز</h2>
            <p id="hero-subtitle" class="text-gray-300 text-lg md:text-xl mb-10 max-w-2xl mx-auto">نقدم لك أفخم العطور الشرقية والفرنسية.</p>
        </div>
    </header>

    <!-- المتجر -->
    <main class="container mx-auto py-12 px-4 flex-grow">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <h3 class="text-3xl font-bold border-b-2 border-gold gold-text pb-2">تصفح العطور</h3>
            
            <!-- فلترة الماركات -->
            <div class="flex gap-2 overflow-x-auto pb-2 w-full md:w-auto" id="brand-filters">
                <button onclick="filterByBrand('all', this)" class="brand-btn bg-gold text-black px-4 py-1.5 rounded-full font-bold text-sm whitespace-nowrap">الكل</button>
                <!-- الماركات هتظهر هنا -->
            </div>
        </div>
        
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- المنتجات -->
        </div>
    </main>

    <footer class="bg-darker border-t border-gray-800 text-center text-gray-500 py-8 mt-auto">
        <p class="font-light">جميع الحقوق محفوظة &copy; 2024 <span id="footer-name">عطور الشرق</span></p>
    </footer>

    <!-- زرار واتساب -->
    <a href="https://wa.me/201012345678?text=مرحباً، أرغب في الاستفسار عن العطور" target="_blank" class="fixed bottom-6 right-6 bg-green-500 text-white w-14 h-14 rounded-full flex items-center justify-center text-3xl shadow-lg hover:bg-green-600 transition z-40 transform hover:scale-110">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- طبقة تعتيم -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-70 z-40 hidden" onclick="toggleCart()"></div>

    <!-- السلة -->
    <div id="cart-sidebar" class="fixed inset-y-0 left-0 w-full md:w-96 bg-card shadow-2xl transform -translate-x-full transition-transform duration-300 z-50 flex flex-col border-l border-gray-800">
        <div class="p-5 border-b border-gray-800 flex justify-between items-center bg-darker">
            <h3 class="text-2xl font-bold gold-text">سلة المشتريات</h3>
            <button onclick="toggleCart()" class="text-3xl text-gray-400 hover:text-white">&times;</button>
        </div>
        
        <div id="cart-items" class="flex-1 p-5 overflow-y-auto"></div>
        
        <div class="p-5 border-t border-gray-800 bg-darker">
            <!-- كوبون الخصم -->
            <div class="flex gap-2 mb-4">
                <input type="text" id="coupon-input" placeholder="كود الخصم" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white text-sm focus:outline-none focus:border-gold">
                <button onclick="applyCoupon()" class="bg-gray-700 text-white px-4 rounded-lg font-bold hover:bg-gray-600 transition">تطبيق</button>
            </div>
            <p id="coupon-msg" class="text-xs font-bold mb-2"></p>

            <div class="flex justify-between font-bold text-lg mb-2">
                <span>الإجمالي:</span>
                <span id="cart-total" class="text-gold">0 ج.م</span>
            </div>
            <div class="flex justify-between text-sm text-green-500 mb-4 hidden" id="discount-row">
                <span>الخصم:</span>
                <span id="discount-amount">0 ج.م</span>
            </div>
            <button onclick="openCheckoutModal()" class="w-full bg-gold text-dark font-bold py-3 rounded-lg hover:bg-yellow-500 transition-colors text-lg">متابعة الطلب</button>
        </div>
    </div>

    <!-- Modal الشحن -->
    <div id="checkout-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-80 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="bg-card w-full max-w-lg rounded-2xl shadow-2xl border border-gray-800 overflow-hidden transform translate-y-10 transition-transform duration-300 modal-content flex flex-col max-h-[90vh]">
            <div class="bg-darker p-4 border-b border-gray-800 flex justify-between items-center">
                <h3 class="text-xl font-bold gold-text">بيانات الشحن</h3>
                <button onclick="closeCheckoutModal()" class="text-2xl text-gray-400 hover:text-white">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto">
                <form id="checkout-form" onsubmit="submitOrder(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">الاسم بالكامل</label>
                        <input type="text" id="customer_name" required class="w-full bg-darker border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-gold transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">رقم الهاتف</label>
                        <input type="tel" id="phone" required class="w-full bg-darker border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-gold transition">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">المحافظة</label>
                            <input type="text" id="city" required class="w-full bg-darker border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-gold transition">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">العنوان بالتفصيل</label>
                            <input type="text" id="address" required class="w-full bg-darker border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-gold transition">
                        </div>
                    </div>
                    <div class="pt-4 border-t border-gray-800 mt-6">
                        <button type="submit" id="submit-btn" class="w-full bg-gold text-dark font-bold py-3 rounded-lg hover:bg-yellow-500 transition-colors text-lg">تأكيد الطلب (الدفع عند الاستلام)</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://icmvrjmkcyjuoxekvvfw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_M05JYZ9LKlIfeDjuCJqzxQ_Ay6EbRKj';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let allProducts = []; // لتخزين المنتجات للبحث والفلترة
        let currentBrand = 'all';
        let appliedDiscount = 0;

        // 1. سحب البيانات
        async function initPage() {
            const { data: settings } = await supabaseClient.from('settings').select('*').eq('id', 1).single();
            if (settings) {
                document.getElementById('site-name').innerText = settings.site_name || 'عطور الشرق';
                document.getElementById('footer-name').innerText = settings.site_name || 'عطور الشرق';
                document.getElementById('hero-title').innerText = settings.hero_title || 'اكتشف عطرك المميز';
                document.getElementById('hero-subtitle').innerText = settings.hero_subtitle || '';
                if(settings.hero_image) document.getElementById('hero-bg').style.backgroundImage = `url('${settings.hero_image}')`;
            }

            const { data: products } = await supabaseClient.from('products').select('*');
            if(products) {
                allProducts = products;
                renderBrands();
                renderProducts();
            }
        }

        // 2. الفلترة والبحث
        function renderBrands() {
            const brands = [...new Set(allProducts.map(p => p.brand))];
            const container = document.getElementById('brand-filters');
            brands.forEach(brand => {
                container.innerHTML += `<button onclick="filterByBrand('${brand}', this)" class="brand-btn bg-gray-800 text-white border border-gray-700 px-4 py-1.5 rounded-full font-bold text-sm whitespace-nowrap hover:border-gold transition">${brand}</button>`;
            });
        }

        function filterByBrand(brand, btn) {
            currentBrand = brand;
            document.querySelectorAll('.brand-btn').forEach(b => {
                b.classList.remove('bg-gold', 'text-black', 'border-gold');
                b.classList.add('bg-gray-800', 'text-white', 'border-gray-700');
            });
            btn.classList.remove('bg-gray-800', 'text-white', 'border-gray-700');
            btn.classList.add('bg-gold', 'text-black', 'border-gold');
            renderProducts();
        }

        function renderProducts() {
            const searchText = document.getElementById('search-input').value.toLowerCase();
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            const filtered = allProducts.filter(p => {
                const matchesBrand = currentBrand === 'all' || p.brand === currentBrand;
                const matchesSearch = p.name.toLowerCase().includes(searchText) || p.brand.toLowerCase().includes(searchText);
                return matchesBrand && matchesSearch;
            });

            if(filtered.length === 0) {
                grid.innerHTML = '<p class="text-center col-span-full text-gray-500 py-10">لا توجد منتجات مطابقة.</p>';
                return;
            }

            filtered.forEach(product => {
                const isOutOfStock = product.stock <= 0;
                grid.innerHTML += `
                    <div class="bg-card rounded-2xl border border-gray-800 overflow-hidden hover:border-gold transition-colors duration-300 group flex flex-col ${isOutOfStock ? 'opacity-70' : ''}">
                        <div class="relative overflow-hidden h-60">
                            <img src="${product.image_url}" alt="${product.name}" class="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-500">
                            <div class="absolute top-4 right-4 bg-black bg-opacity-70 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-bold text-gold border border-gray-700">${product.brand}</div>
                            ${isOutOfStock ? '<div class="absolute inset-0 bg-black/60 flex items-center justify-center"><span class="bg-red-600 text-white px-4 py-2 rounded font-bold">نفذت الكمية</span></div>' : ''}
                        </div>
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <h4 class="text-xl font-bold mb-1 gold-text truncate">${product.name}</h4>
                                <p class="text-gray-400 text-xs mb-3 truncate">${product.notes}</p>
                            </div>
                            <div class="flex justify-between items-center mt-2">
                                <span class="text-white font-bold text-xl">${product.price} <span class="text-xs text-gray-500">ج.م</span></span>
                                <button onclick="addToCart(${product.id}, '${product.name}', ${product.price})" ${isOutOfStock ? 'disabled' : ''} class="bg-darker border border-gray-700 text-gold px-4 py-1.5 rounded-lg hover:bg-gold hover:text-dark transition-all duration-300 font-bold text-sm ${isOutOfStock ? 'cursor-not-allowed' : ''}">أضف</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('search-input').addEventListener('input', renderProducts);

        // 3. السلة والكوبونات
        function addToCart(id, name, price) {
            const existing = cart.find(item => item.id === id);
            if (existing) { existing.qty += 1; } 
            else { cart.push({ id, name, price, qty: 1 }); }
            saveCart();
            if (!document.getElementById('cart-sidebar').classList.contains('cart-open')) { toggleCart(); }
        }

        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            const totalCount = cart.reduce((total, item) => total + item.qty, 0);
            document.getElementById('cart-count').innerText = totalCount;
            
            const cartItemsDiv = document.getElementById('cart-items');
            let totalPrice = 0;

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<p class="text-center text-gray-500 mt-10">السلة فارغة</p>';
                document.getElementById('cart-total').innerText = '0 ج.م';
                return;
            }

            cartItemsDiv.innerHTML = '';
            cart.forEach((item, index) => {
                totalPrice += item.price * item.qty;
                cartItemsDiv.innerHTML += `
                    <div class="flex justify-between items-center border-b border-gray-800 pb-4 mb-4">
                        <div class="flex-1">
                            <p class="font-bold text-lg text-white">${item.name}</p>
                            <p class="text-sm text-gold mt-1">${item.price} ج.م × ${item.qty}</p>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-400 text-sm font-bold border border-red-500/30 px-3 py-1 rounded">حذف</button>
                    </div>
                `;
            });
            
            // حساب الخصم
            let discountAmount = (totalPrice * appliedDiscount) / 100;
            let finalTotal = totalPrice - discountAmount;

            document.getElementById('cart-total').innerText = finalTotal.toFixed(0) + ' ج.م';
            
            if(appliedDiscount > 0) {
                document.getElementById('discount-row').classList.remove('hidden');
                document.getElementById('discount-amount').innerText = discountAmount.toFixed(0) + ' ج.م';
            } else {
                document.getElementById('discount-row').classList.add('hidden');
            }
        }

        async function applyCoupon() {
            const code = document.getElementById('coupon-input').value.trim();
            const msg = document.getElementById('coupon-msg');
            if(!code) return;

            const { data, error } = await supabaseClient.from('coupons').select('*').eq('code', code).eq('active', true).single();
            
            if(data) {
                appliedDiscount = data.discount_percent;
                msg.innerText = `تم تطبيق خصم ${appliedDiscount}%!`;
                msg.className = 'text-green-500 text-xs font-bold mb-2';
                updateCartUI();
            } else {
                appliedDiscount = 0;
                msg.innerText = 'كود الخصم غير صحيح أو منتهي.';
                msg.className = 'text-red-500 text-xs font-bold mb-2';
                updateCartUI();
            }
        }

        function removeFromCart(index) { cart.splice(index, 1); saveCart(); }

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('overlay');
            if (sidebar.classList.contains('cart-open')) {
                sidebar.classList.remove('cart-open');
                overlay.classList.add('hidden');
            } else {
                sidebar.classList.add('cart-open');
                overlay.classList.remove('hidden');
            }
        }

        // 4. الطلب
        function openCheckoutModal() {
            if (cart.length === 0) return alert('السلة فارغة!');
            document.getElementById('checkout-modal').classList.add('modal-open');
            document.getElementById('cart-sidebar').classList.remove('cart-open');
            document.getElementById('overlay').classList.add('hidden');
        }

        function closeCheckoutModal() { document.getElementById('checkout-modal').classList.remove('modal-open'); }

        async function submitOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = 'جاري تأكيد الطلب...';
            btn.disabled = true;

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const discountAmount = (totalPrice * appliedDiscount) / 100;
            const finalTotal = totalPrice - discountAmount;
            
            const orderData = {
                customer_name: document.getElementById('customer_name').value,
                phone: document.getElementById('phone').value,
                city: document.getElementById('city').value,
                address: document.getElementById('address').value,
                total_price: finalTotal,
                items: cart,
                status: 'pending'
            };

            const { error } = await supabaseClient.from('orders').insert([orderData]);

            if (error) {
                alert('حدث خطأ أثناء حفظ الطلب.');
                btn.innerText = 'تأكيد الطلب (الدفع عند الاستلام)';
                btn.disabled = false;
                return;
            }

            alert(`تم استلام طلبك بنجاح يا ${orderData.customer_name}!`);
            cart = []; appliedDiscount = 0; saveCart();
            closeCheckoutModal();
            document.getElementById('checkout-form').reset();
            btn.innerText = 'تأكيد الطلب (الدفع عند الاستلام)';
            btn.disabled = false;
            document.getElementById('coupon-msg').innerText = '';
        }

        // تسجيل الزيارات
        async function logVisit() {
            const lastVisit = sessionStorage.getItem('lastVisit');
            const now = Date.now();
            if (!lastVisit || now - lastVisit > 30 * 60 * 1000) {
                await supabaseClient.from('visits').insert([{}]);
                sessionStorage.setItem('lastVisit', now);
            }
        }

        // التحديث اللحظي
        supabaseClient.channel('store-realtime')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => initPage())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, () => initPage())
            .subscribe();

        initPage();
        updateCartUI();
        logVisit();
    </script>
</body>
</html>
