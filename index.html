<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عطور الشرق | الفخامة والتميز</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { gold: '#D4AF37', dark: '#0a0a0a', darker: '#050505', card: '#111111' }, 
                    fontFamily: { cairo: ['Cairo', 'sans-serif'], playfair: ['Playfair Display', 'serif'] } 
                } 
            } 
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0a0a0a; color: #f3f4f6; }
        .gold-text { font-family: 'Playfair Display', serif; color: #D4AF37; }
        .cart-open { transform: translateX(0) !important; }
        .modal-open { opacity: 1 !important; pointer-events: auto !important; }
        .modal-content { transform: translateY(0) !important; }
        .glass { background: rgba(10, 10, 10, 0.7); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(212, 175, 55, 0.2); }
    </style>
</head>
<body class="relative min-h-screen flex flex-col">

    <!-- شريط التنقل -->
    <nav class="glass text-white p-4 sticky top-0 z-40 transition-all duration-300">
        <div class="container mx-auto flex justify-between items-center">
            <h1 id="site-name" class="text-3xl font-bold gold-text tracking-wide">عطور الشرق</h1>
            
            <div class="hidden md:flex items-center gap-8">
                <a href="#" id="nav-home" class="hover:text-gold transition font-bold text-sm">الرئيسية</a>
                <a href="#products" id="nav-shop" class="hover:text-gold transition font-bold text-sm">المتجر</a>
            </div>

            <div class="flex items-center gap-4 md:gap-6">
                <!-- تتبع الطلب -->
                <button onclick="openTrackingModal()" class="text-sm font-bold text-gray-300 hover:text-gold transition flex items-center gap-2">
                    <i class="fa-solid fa-truck-fast"></i> <span id="nav-track" class="hidden md:inline">تتبع طلبك</span>
                </button>

                <!-- السلة -->
                <div class="relative cursor-pointer group" onclick="toggleCart()">
                    <span class="text-2xl group-hover:text-gold transition"><i class="fa-solid fa-cart-shopping"></i></span>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-gold text-black text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full">0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- البانر -->
    <header class="relative bg-darker text-center py-24 px-4 overflow-hidden border-b border-gray-800">
        <div id="hero-bg" class="absolute inset-0 bg-cover bg-center opacity-30 transition-transform duration-[10s] hover:scale-110"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-dark to-transparent"></div>
        <div class="relative z-10">
            <h2 id="hero-title" class="text-5xl md:text-7xl font-bold mb-6 gold-text drop-shadow-2xl">اكتشف عطرك المميز</h2>
            <p id="hero-subtitle" class="text-gray-300 text-lg md:text-xl mb-10 max-w-2xl mx-auto font-light leading-relaxed">نقدم لك أفخم العطور الشرقية والفرنسية.</p>
            <button onclick="document.getElementById('products').scrollIntoView({behavior: 'smooth'})" id="hero-btn" class="bg-gold text-dark px-10 py-4 rounded-full font-bold hover:bg-white hover:text-black transition-all duration-300 transform hover:-translate-y-1 shadow-[0_0_20px_rgba(212,175,55,0.4)]">تسوق الآن</button>
        </div>
    </header>

    <!-- المتجر -->
    <main class="container mx-auto py-16 px-4 flex-grow" id="products">
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-4 border-b border-gray-800 pb-4">
            <h3 id="section-title" class="text-3xl font-bold gold-text">تصفح العطور</h3>
            <div class="relative w-full md:w-72">
                <input type="text" id="search-input" placeholder="ابحث عن عطرك المفضل..." class="w-full bg-card text-white border border-gray-700 rounded-full py-3 px-5 focus:outline-none focus:border-gold focus:ring-1 focus:ring-gold transition">
                <i class="fa-solid fa-search absolute left-5 top-4 text-gray-500"></i>
            </div>
        </div>
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </main>

    <!-- الفوتر -->
    <footer class="bg-darker border-t border-gray-800 py-10 mt-auto">
        <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-6">
            <p class="font-light text-gray-500 text-sm"><span id="footer-text">جميع الحقوق محفوظة</span> &copy; 2024 <span id="footer-name" class="text-gold font-bold">عطور الشرق</span></p>
            <div id="social-links" class="flex gap-5 text-2xl"></div>
        </div>
    </footer>

    <!-- زرار واتساب -->
    <a id="whatsapp-btn" href="#" target="_blank" class="hidden fixed bottom-8 right-8 bg-green-500 text-white w-16 h-16 rounded-full flex items-center justify-center text-4xl shadow-[0_10px_20px_rgba(34,197,94,0.3)] hover:bg-green-400 transition transform hover:scale-110 z-40"><i class="fa-brands fa-whatsapp"></i></a>

    <!-- ==================== النوافذ المنبثقة ==================== -->

    <!-- 1. السلة -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-80 z-40 hidden backdrop-blur-sm" onclick="toggleCart()"></div>
    <div id="cart-sidebar" class="fixed inset-y-0 left-0 w-full md:w-[400px] bg-card shadow-2xl transform -translate-x-full transition-transform duration-500 z-50 flex flex-col border-l border-gray-800">
        <div class="p-6 border-b border-gray-800 flex justify-between items-center bg-darker">
            <h3 class="text-2xl font-bold gold-text">سلة المشتريات</h3>
            <button onclick="toggleCart()" class="text-3xl text-gray-400 hover:text-white transition">&times;</button>
        </div>
        <div id="cart-items" class="flex-1 p-6 overflow-y-auto"></div>
        <div class="p-6 border-t border-gray-800 bg-darker">
            <div class="flex gap-2 mb-4">
                <input type="text" id="coupon-input" placeholder="كود الخصم" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white text-sm focus:outline-none focus:border-gold uppercase">
                <button onclick="applyCoupon()" class="bg-gray-700 text-white px-5 rounded-lg font-bold hover:bg-gray-600 transition">تطبيق</button>
            </div>
            <p id="coupon-msg" class="text-xs font-bold mb-2"></p>
            <div class="flex justify-between font-bold text-xl mb-2"><span>الإجمالي:</span><span id="cart-total" class="text-gold">0 ج.م</span></div>
            <div class="flex justify-between text-sm text-green-500 mb-6 hidden" id="discount-row"><span>الخصم:</span><span id="discount-amount">0 ج.م</span></div>
            <button onclick="openCheckoutModal()" id="btn-checkout-dyn" class="w-full bg-gold text-dark font-bold py-4 rounded-xl hover:bg-white transition-colors text-lg">متابعة الطلب</button>
        </div>
    </div>

    <!-- 2. الفورم (Checkout) -->
    <div id="checkout-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-90 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="bg-card w-full max-w-lg rounded-3xl shadow-2xl border border-gray-800 overflow-hidden transform translate-y-10 transition-transform duration-300 modal-content flex flex-col max-h-[90vh]">
            <div class="bg-darker p-6 border-b border-gray-800 flex justify-between items-center"><h3 class="text-2xl font-bold gold-text">بيانات الشحن</h3><button onclick="closeCheckoutModal()" class="text-2xl text-gray-400 hover:text-white">&times;</button></div>
            <div class="p-6 overflow-y-auto">
                <form id="checkout-form" onsubmit="submitOrder(event)" class="space-y-5">
                    <div>
                        <label class="block text-sm font-bold text-gray-400 mb-1">الاسم بالكامل</label>
                        <input type="text" id="customer_name" required class="w-full bg-darker border border-gray-700 rounded-xl p-3 text-white focus:border-gold focus:ring-1 focus:ring-gold outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-400 mb-1">رقم الهاتف</label>
                        <input type="tel" id="phone" required class="w-full bg-darker border border-gray-700 rounded-xl p-3 text-white focus:border-gold focus:ring-1 focus:ring-gold outline-none transition">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-400 mb-1">المحافظة</label>
                            <input type="text" id="city" required class="w-full bg-darker border border-gray-700 rounded-xl p-3 text-white focus:border-gold focus:ring-1 focus:ring-gold outline-none transition">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-400 mb-1">العنوان</label>
                            <input type="text" id="address" required class="w-full bg-darker border border-gray-700 rounded-xl p-3 text-white focus:border-gold focus:ring-1 focus:ring-gold outline-none transition">
                        </div>
                    </div>
                    <button type="submit" id="submit-btn" class="w-full bg-gold text-dark font-bold py-4 rounded-xl hover:bg-white mt-4 text-lg transition">تأكيد الطلب (الدفع عند الاستلام)</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 3. تتبع الطلب -->
    <div id="tracking-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-90 opacity-0 pointer-events-none transition-opacity p-4">
        <div class="bg-card w-full max-w-md rounded-3xl shadow-2xl border border-gray-800 p-6 relative modal-content">
            <button onclick="document.getElementById('tracking-modal').classList.remove('modal-open')" class="absolute top-4 left-4 text-gray-400 text-2xl hover:text-white transition">&times;</button>
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gray-800 rounded-full flex items-center justify-center mx-auto mb-4 text-gold text-2xl"><i class="fa-solid fa-truck-fast"></i></div>
                <h3 class="text-2xl font-bold gold-text">تتبع طلبك</h3>
            </div>
            
            <div class="flex flex-col gap-3 mb-6">
                <input type="tel" id="track-phone" placeholder="اكتب رقم تليفونك هنا" class="w-full bg-darker border border-gray-700 rounded-xl p-4 text-white text-center focus:border-gold outline-none">
                <button onclick="trackOrder()" class="w-full bg-gold text-dark py-3 rounded-xl font-bold hover:bg-white transition">بحث عن الطلب</button>
            </div>
            
            <div id="tracking-result" class="hidden space-y-3"></div>
        </div>
    </div>

    <!-- 4. التقييمات -->
    <div id="reviews-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-90 opacity-0 pointer-events-none transition-opacity p-4">
        <div class="bg-card w-full max-w-lg rounded-3xl shadow-2xl border border-gray-800 overflow-hidden flex flex-col max-h-[90vh] modal-content">
            <div class="bg-darker p-6 flex justify-between items-center">
                <h3 class="text-2xl font-bold gold-text">آراء العملاء</h3>
                <button onclick="document.getElementById('reviews-modal').classList.remove('modal-open')" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto">
                <form onsubmit="submitReview(event)" class="mb-8 bg-darker p-5 rounded-xl border border-gray-800">
                    <input type="hidden" id="review-product-id">
                    <div class="flex items-center gap-3 mb-3">
                        <span class="text-sm font-bold text-gray-300">تقييمك:</span>
                        <select id="review-rating" required class="bg-gray-800 text-gold font-bold p-2 rounded-lg outline-none border border-gray-700">
                            <option value="5">⭐⭐⭐⭐⭐ ممتاز</option>
                            <option value="4">⭐⭐⭐⭐ جيد جداً</option>
                            <option value="3">⭐⭐⭐ جيد</option>
                            <option value="2">⭐⭐ مقبول</option>
                            <option value="1">⭐ سيء</option>
                        </select>
                    </div>
                    <input type="text" id="review-name" placeholder="اسمك" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white text-sm mb-3 outline-none focus:border-gold">
                    <textarea id="review-comment" placeholder="اكتب تجربتك مع العطر..." required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white text-sm mb-3 outline-none focus:border-gold" rows="3"></textarea>
                    <button type="submit" class="bg-gold text-black font-bold py-2 px-6 rounded-lg text-sm hover:bg-white transition">إرسال التقييم</button>
                </form>
                <div id="reviews-list" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://icmvrjmkcyjuoxekvvfw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_M05JYZ9LKlIfeDjuCJqzxQ_Ay6EbRKj';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let allProducts = [];
        let appliedDiscount = 0;
        let dynamicTexts = {}; // لحفظ النصوص عشان نستخدمها في الكروت

        async function initPage() {
            // 1. سحب الإعدادات (النصوص والصور)
            const { data: settings } = await supabaseClient.from('settings').select('*').eq('id', 1).single();
            if (settings) {
                dynamicTexts = settings; // حفظ الإعدادات
                
                // تحديث النصوص في الـ HTML
                document.getElementById('site-name').innerText = settings.site_name || 'عطور الشرق';
                document.getElementById('footer-name').innerText = settings.site_name || 'عطور الشرق';
                document.getElementById('hero-title').innerText = settings.hero_title || '';
                document.getElementById('hero-subtitle').innerText = settings.hero_subtitle || '';
                document.getElementById('nav-home').innerText = settings.nav_home || 'الرئيسية';
                document.getElementById('nav-shop').innerText = settings.nav_shop || 'المتجر';
                document.getElementById('nav-track').innerText = settings.nav_track || 'تتبع طلبك';
                document.getElementById('hero-btn').innerText = settings.hero_btn || 'تسوق الآن';
                document.getElementById('section-title').innerText = settings.section_title || 'تصفح العطور';
                document.getElementById('btn-checkout-dyn').innerText = settings.btn_checkout || 'متابعة الطلب';
                document.getElementById('footer-text').innerText = settings.footer_text || 'جميع الحقوق محفوظة';

                if(settings.hero_image) document.getElementById('hero-bg').style.backgroundImage = `url('${settings.hero_image}')`;
                
                const waBtn = document.getElementById('whatsapp-btn');
                if(settings.whatsapp_number) {
                    waBtn.href = `https://wa.me/${settings.whatsapp_number}`;
                    waBtn.classList.remove('hidden');
                }

                const socialDiv = document.getElementById('social-links');
                socialDiv.innerHTML = '';
                if(settings.facebook_url) socialDiv.innerHTML += `<a href="${settings.facebook_url}" target="_blank" class="hover:text-blue-500 transition"><i class="fa-brands fa-facebook"></i></a>`;
                if(settings.instagram_url) socialDiv.innerHTML += `<a href="${settings.instagram_url}" target="_blank" class="hover:text-pink-500 transition"><i class="fa-brands fa-instagram"></i></a>`;
                if(settings.tiktok_url) socialDiv.innerHTML += `<a href="${settings.tiktok_url}" target="_blank" class="hover:text-white transition"><i class="fa-brands fa-tiktok"></i></a>`;
            }

            // 2. سحب المنتجات
            const { data: products } = await supabaseClient.from('products').select('*');
            if(products) {
                allProducts = products;
                renderProducts();
            }
        }

        function renderProducts() {
            const searchText = document.getElementById('search-input').value.toLowerCase();
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(searchText) || p.brand.toLowerCase().includes(searchText));

            filtered.forEach(product => {
                const isOutOfStock = product.stock <= 0;
                const addToCartText = dynamicTexts.btn_add_to_cart || 'أضف للسلة';
                
                grid.innerHTML += `
                    <div class="bg-card rounded-2xl border border-gray-800 overflow-hidden hover:border-gold hover:shadow-[0_0_30px_rgba(212,175,55,0.1)] transition-all duration-500 group flex flex-col ${isOutOfStock ? 'opacity-60 grayscale' : ''}">
                        <div class="relative overflow-hidden h-72">
                            <img src="${product.image_url}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                            <div class="absolute top-4 right-4 bg-black/80 backdrop-blur-md px-4 py-1.5 rounded-full text-xs font-bold text-gold border border-gray-700">${product.brand}</div>
                            ${isOutOfStock ? '<div class="absolute inset-0 bg-black/60 flex items-center justify-center"><span class="bg-red-600 px-6 py-2 rounded-xl font-bold text-white shadow-lg">نفذت الكمية</span></div>' : ''}
                        </div>
                        <div class="p-6 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <h4 class="text-2xl font-bold gold-text truncate">${product.name}</h4>
                                    <button onclick="openReviews(${product.id})" class="text-gray-500 hover:text-gold transition text-sm"><i class="fa-solid fa-star"></i></button>
                                </div>
                                <p class="text-gray-400 text-sm mb-4 line-clamp-2">${product.notes}</p>
                            </div>
                            <div class="flex justify-between items-center mt-4 pt-4 border-t border-gray-800">
                                <span class="text-white font-bold text-2xl">${product.price} <span class="text-sm text-gray-500">ج.م</span></span>
                                <button onclick="addToCart(${product.id}, '${product.name}', ${product.price})" ${isOutOfStock ? 'disabled' : ''} class="bg-darker border border-gray-700 text-gold px-5 py-2.5 rounded-xl hover:bg-gold hover:text-dark transition-all duration-300 font-bold ${isOutOfStock ? 'cursor-not-allowed' : ''}">${addToCartText}</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
        
        document.getElementById('search-input').addEventListener('input', renderProducts);

        // ... باقي الدوال زي ما هي (السلة، التتبع، التقييمات) ...
        async function openReviews(productId) {
            document.getElementById('reviews-modal').classList.add('modal-open');
            document.getElementById('review-product-id').value = productId;
            const listDiv = document.getElementById('reviews-list');
            listDiv.innerHTML = '<p class="text-center text-gray-500 text-sm">جاري التحميل...</p>';
            const { data: reviews } = await supabaseClient.from('reviews').select('*').eq('product_id', productId).eq('status', 'approved').order('created_at', { ascending: false });
            if(!reviews || reviews.length === 0) { listDiv.innerHTML = '<p class="text-center text-gray-500 text-sm">لا يوجد تقييمات بعد.</p>'; return; }
            listDiv.innerHTML = reviews.map(r => `<div class="border-b border-gray-800 pb-3"><div class="flex justify-between items-center mb-1"><span class="font-bold text-sm text-gray-300">${r.customer_name}</span><span class="text-yellow-500 text-xs">${'⭐'.repeat(r.rating)}</span></div><p class="text-gray-400 text-sm">${r.comment}</p></div>`).join('');
        }

        async function submitReview(e) {
            e.preventDefault();
            const pId = document.getElementById('review-product-id').value;
            const data = { product_id: pId, rating: parseInt(document.getElementById('review-rating').value), customer_name: document.getElementById('review-name').value, comment: document.getElementById('review-comment').value };
            const { error } = await supabaseClient.from('reviews').insert([data]);
            if(error) alert('حدث خطأ!'); else { alert('شكراً لتقييمك! سيظهر بعد المراجعة.'); document.getElementById('review-comment').value = ''; document.getElementById('reviews-modal').classList.remove('modal-open'); }
        }

        function openTrackingModal() { document.getElementById('tracking-modal').classList.add('modal-open'); }
        async function trackOrder() {
            const phone = document.getElementById('track-phone').value;
            if(!phone) return alert('اكتب رقم الهاتف');
            const resultDiv = document.getElementById('tracking-result'); resultDiv.innerHTML = '<p class="text-center text-gray-400">جاري البحث...</p>'; resultDiv.classList.remove('hidden');
            const { data: orders } = await supabaseClient.from('orders').select('*').eq('phone', phone).order('created_at', { ascending: false }).limit(1);
            if (!orders || orders.length === 0) { resultDiv.innerHTML = '<p class="text-center text-red-500 font-bold">مفيش طلبات بالرقم ده!</p>'; return; }
            const order = orders[0];
            let statusText = order.status === 'pending' ? 'قيد التجهيز' : order.status === 'shipped' ? 'تم الشحن' : 'تم التسليم';
            let statusColor = order.status === 'pending' ? 'text-yellow-500' : order.status === 'shipped' ? 'text-blue-500' : 'text-green-500';
            resultDiv.innerHTML = `<div class="bg-darker p-5 rounded-xl border border-gray-800 text-center mt-4"><p class="text-gray-400 text-sm mb-1">الطلب #${order.id}</p><p class="text-2xl font-bold ${statusColor} mb-2">${statusText}</p><p class="text-sm text-gray-300">الإجمالي: <strong class="text-gold">${order.total_price} ج.م</strong></p>${order.shipping_company ? `<p class="text-xs text-gray-400 mt-2">شركة الشحن: ${order.shipping_company}</p>` : ''}${order.tracking_number ? `<p class="text-xs text-gray-400">رقم التتبع: <span class="text-blue-400" dir="ltr">${order.tracking_number}</span></p>` : ''}</div>`;
        }

        function addToCart(id, name, price) { const existing = cart.find(item => item.id === id); if (existing) { existing.qty += 1; } else { cart.push({ id, name, price, qty: 1 }); } saveCart(); toggleCart(); }
        function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); updateCartUI(); }
        function updateCartUI() {
            const totalCount = cart.reduce((total, item) => total + item.qty, 0); document.getElementById('cart-count').innerText = totalCount;
            const cartItemsDiv = document.getElementById('cart-items'); let totalPrice = 0;
            if (cart.length === 0) { cartItemsDiv.innerHTML = '<p class="text-center text-gray-500 mt-10">السلة فارغة</p>'; document.getElementById('cart-total').innerText = '0 ج.م'; return; }
            cartItemsDiv.innerHTML = '';
            cart.forEach((item, index) => { totalPrice += item.price * item.qty; cartItemsDiv.innerHTML += `<div class="flex justify-between items-center border-b border-gray-800 pb-4 mb-4"><div><p class="font-bold text-white">${item.name}</p><p class="text-sm text-gold">${item.price} × ${item.qty}</p></div><button onclick="removeFromCart(${index})" class="text-red-500 font-bold text-sm">حذف</button></div>`; });
            let discountAmount = (totalPrice * appliedDiscount) / 100;
            document.getElementById('cart-total').innerText = (totalPrice - discountAmount).toFixed(0) + ' ج.م';
            if(appliedDiscount > 0) { document.getElementById('discount-row').classList.remove('hidden'); document.getElementById('discount-amount').innerText = discountAmount.toFixed(0) + ' ج.م'; } else { document.getElementById('discount-row').classList.add('hidden'); }
        }
        function removeFromCart(index) { cart.splice(index, 1); saveCart(); }
        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('cart-open'); document.getElementById('overlay').classList.toggle('hidden'); }
        function openCheckoutModal() { if (cart.length === 0) return alert('السلة فارغة!'); document.getElementById('checkout-modal').classList.add('modal-open'); document.getElementById('cart-sidebar').classList.remove('cart-open'); document.getElementById('overlay').classList.add('hidden'); }
        function closeCheckoutModal() { document.getElementById('checkout-modal').classList.remove('modal-open'); }
        async function applyCoupon() { const code = document.getElementById('coupon-input').value.trim().toUpperCase(); const { data } = await supabaseClient.from('coupons').select('*').eq('code', code).eq('active', true).single(); if(data) { appliedDiscount = data.discount_percent; document.getElementById('coupon-msg').innerText = `خصم ${appliedDiscount}%`; document.getElementById('coupon-msg').className = 'text-green-500 text-xs mb-2'; updateCartUI(); } else { appliedDiscount = 0; document.getElementById('coupon-msg').innerText = 'كود غير صحيح'; document.getElementById('coupon-msg').className = 'text-red-500 text-xs mb-2'; updateCartUI(); } }
        async function submitOrder(e) { e.preventDefault(); const btn = document.getElementById('submit-btn'); btn.innerText = 'جاري...'; btn.disabled = true; const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0); const finalTotal = totalPrice - ((totalPrice * appliedDiscount) / 100); const orderData = { customer_name: document.getElementById('customer_name').value, phone: document.getElementById('phone').value, city: document.getElementById('city').value, address: document.getElementById('address').value, total_price: finalTotal, items: cart, status: 'pending' }; const { error } = await supabaseClient.from('orders').insert([orderData]); if (error) { alert('خطأ!'); btn.innerText = 'تأكيد'; btn.disabled = false; return; } alert(`تم استلام طلبك!`); cart = []; appliedDiscount = 0; saveCart(); closeCheckoutModal(); document.getElementById('checkout-form').reset(); btn.innerText = 'تأكيد'; btn.disabled = false; }
        async function logVisit() { const lastVisit = sessionStorage.getItem('lastVisit'); if (!lastVisit || Date.now() - lastVisit > 30 * 60 * 1000) { await supabaseClient.from('visits').insert([{}]); sessionStorage.setItem('lastVisit', Date.now()); } }

        initPage(); updateCartUI(); logVisit();
    </script>
</body>
</html>
