<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عطور الشرق | الفخامة والتميز</title>
    <meta name="description" content="اشتري أفخم العطور الشرقية والفرنسية الأصلية بأفضل الأسعار.">
    
    <!-- 📈 ضع كود Facebook Pixel هنا (لو هتعلن) -->
    <!-- <script> !function(f,b,e,v,n,t,s)... </script> -->

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = { theme: { extend: { colors: { gold: '#D4AF37', dark: '#0a0a0a', darker: '#050505', card: '#111111' }, fontFamily: { cairo: ['Cairo', 'sans-serif'], amiri: ['Amiri', 'serif'] } } } }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0a0a0a; color: #f3f4f6; }
        .gold-text { font-family: 'Amiri', serif; color: #D4AF37; }
        .cart-open { transform: translateX(0) !important; }
        .modal-open { opacity: 1 !important; pointer-events: auto !important; }
        .modal-content { transform: translateY(0) !important; }
    </style>
</head>
<body class="relative min-h-screen flex flex-col">

    <!-- شريط التنقل -->
    <nav class="bg-darker bg-opacity-90 backdrop-blur-md text-white p-4 sticky top-0 z-40 border-b border-gray-800">
        <div class="container mx-auto flex justify-between items-center">
            <h1 id="site-name" class="text-3xl font-bold gold-text tracking-wide hidden md:block">عطور الشرق</h1>
            
            <div class="flex items-center gap-2 md:gap-6">
                <!-- تسجيل الدخول / حسابي -->
                <button onclick="openAuthModal()" id="auth-btn" class="text-sm font-bold text-gray-300 hover:text-gold transition"><i class="fa-solid fa-user mr-1"></i> <span id="user-name-display" class="hidden md:inline">دخول</span></button>
                
                <!-- تتبع الطلب -->
                <button onclick="openTrackingModal()" class="text-sm font-bold text-gray-300 hover:text-gold transition"><i class="fa-solid fa-truck-fast mr-1"></i> <span class="hidden md:inline">تتبع طلبك</span></button>

                <!-- السلة -->
                <div class="relative cursor-pointer group" onclick="toggleCart()">
                    <span class="text-2xl group-hover:text-gold transition"><i class="fa-solid fa-cart-shopping"></i></span>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-gold text-black text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full">0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- باقي الموقع (البانر والمنتجات) -->
    <header class="relative bg-darker text-center py-20 px-4 overflow-hidden">
        <div id="hero-bg" class="absolute inset-0 bg-cover bg-center opacity-20"></div>
        <div class="relative z-10">
            <h2 id="hero-title" class="text-5xl md:text-7xl font-bold mb-6 gold-text drop-shadow-lg">اكتشف عطرك المميز</h2>
            <p id="hero-subtitle" class="text-gray-300 text-lg md:text-xl mb-10 max-w-2xl mx-auto">نقدم لك أفخم العطور الشرقية والفرنسية.</p>
        </div>
    </header>

    <main class="container mx-auto py-12 px-4 flex-grow">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <h3 class="text-3xl font-bold border-b-2 border-gold gold-text pb-2">تصفح العطور</h3>
            <div class="relative w-full md:w-64">
                <input type="text" id="search-input" placeholder="ابحث..." class="w-full bg-gray-900 text-white border border-gray-700 rounded-full py-2 px-4 focus:outline-none focus:border-gold">
            </div>
        </div>
        <div id="products-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

    <!-- الفوتر -->
    <footer class="bg-darker border-t border-gray-800 py-8 mt-auto">
        <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="font-light text-gray-500 text-sm">جميع الحقوق محفوظة &copy; 2024 <span id="footer-name" class="text-gold font-bold">عطور الشرق</span></p>
            <div id="social-links" class="flex gap-4 text-xl"></div>
        </div>
    </footer>

    <!-- زرار واتساب -->
    <a id="whatsapp-btn" href="#" target="_blank" class="hidden fixed bottom-6 right-6 bg-green-500 text-white w-14 h-14 rounded-full flex items-center justify-center text-3xl shadow-lg hover:bg-green-600 transition z-40"><i class="fa-brands fa-whatsapp"></i></a>

    <!-- ==================== النوافذ المنبثقة (Modals) ==================== -->

    <!-- 1. السلة -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-70 z-40 hidden" onclick="toggleCart()"></div>
    <div id="cart-sidebar" class="fixed inset-y-0 left-0 w-full md:w-96 bg-card shadow-2xl transform -translate-x-full transition-transform duration-300 z-50 flex flex-col border-l border-gray-800">
        <div class="p-5 border-b border-gray-800 flex justify-between items-center bg-darker">
            <h3 class="text-2xl font-bold gold-text">السلة</h3>
            <button onclick="toggleCart()" class="text-3xl text-gray-400 hover:text-white">&times;</button>
        </div>
        <div id="cart-items" class="flex-1 p-5 overflow-y-auto"></div>
        <div class="p-5 border-t border-gray-800 bg-darker">
            <div class="flex gap-2 mb-4">
                <input type="text" id="coupon-input" placeholder="كود الخصم" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2 text-white text-sm focus:outline-none focus:border-gold uppercase">
                <button onclick="applyCoupon()" class="bg-gray-700 text-white px-4 rounded-lg font-bold hover:bg-gray-600">تطبيق</button>
            </div>
            <p id="coupon-msg" class="text-xs font-bold mb-2"></p>
            <div class="flex justify-between font-bold text-lg mb-2"><span>الإجمالي:</span><span id="cart-total" class="text-gold">0 ج.م</span></div>
            <div class="flex justify-between text-sm text-green-500 mb-4 hidden" id="discount-row"><span>الخصم:</span><span id="discount-amount">0 ج.م</span></div>
            <button onclick="openCheckoutModal()" class="w-full bg-gold text-dark font-bold py-3 rounded-lg hover:bg-yellow-500 transition-colors">متابعة الطلب</button>
        </div>
    </div>

    <!-- 2. الفورم (Checkout) -->
    <div id="checkout-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-80 opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="bg-card w-full max-w-lg rounded-2xl shadow-2xl border border-gray-800 overflow-hidden transform translate-y-10 transition-transform duration-300 modal-content flex flex-col max-h-[90vh]">
            <div class="bg-darker p-4 border-b border-gray-800 flex justify-between items-center"><h3 class="text-xl font-bold gold-text">بيانات الشحن</h3><button onclick="closeCheckoutModal()" class="text-2xl text-gray-400 hover:text-white">&times;</button></div>
            <div class="p-6 overflow-y-auto">
                <form id="checkout-form" onsubmit="submitOrder(event)" class="space-y-4">
                    <input type="text" id="customer_name" placeholder="الاسم بالكامل" required class="w-full bg-darker border border-gray-700 rounded-lg p-3 text-white focus:border-gold">
                    <input type="tel" id="phone" placeholder="رقم الهاتف" required class="w-full bg-darker border border-gray-700 rounded-lg p-3 text-white focus:border-gold">
                    <div class="grid grid-cols-2 gap-4">
                        <input type="text" id="city" placeholder="المحافظة" required class="w-full bg-darker border border-gray-700 rounded-lg p-3 text-white focus:border-gold">
                        <input type="text" id="address" placeholder="العنوان بالتفصيل" required class="w-full bg-darker border border-gray-700 rounded-lg p-3 text-white focus:border-gold">
                    </div>
                    <button type="submit" id="submit-btn" class="w-full bg-gold text-dark font-bold py-3 rounded-lg hover:bg-yellow-500 mt-4">تأكيد الطلب (الدفع عند الاستلام)</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 3. تسجيل الدخول (Auth) -->
    <div id="auth-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-80 opacity-0 pointer-events-none transition-opacity p-4">
        <div class="bg-card w-full max-w-sm rounded-2xl shadow-2xl border border-gray-800 p-6 relative">
            <button onclick="document.getElementById('auth-modal').classList.remove('modal-open')" class="absolute top-2 left-2 text-gray-400 text-2xl">&times;</button>
            <h3 class="text-2xl font-bold gold-text text-center mb-6" id="auth-title">تسجيل دخول</h3>
            
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <input type="email" id="auth-email" placeholder="الإيميل" required class="w-full bg-darker border border-gray-700 rounded-lg p-3 text-white focus:border-gold">
                <input type="password" id="auth-password" placeholder="الباسورد (6 حروف/أرقام على الأقل)" required class="w-full bg-darker border border-gray-700 rounded-lg p-3 text-white focus:border-gold">
                <div id="name-field" class="hidden">
                    <input type="text" id="auth-name" placeholder="الاسم بالكامل" class="w-full bg-darker border border-gray-700 rounded-lg p-3 text-white focus:border-gold">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-gold text-dark font-bold py-3 rounded-lg hover:bg-yellow-500">دخول</button>
            </form>
            
            <p class="text-center text-gray-400 text-sm mt-4">
                <span id="auth-toggle-text">معندكش حساب؟</span> 
                <button onclick="toggleAuthMode()" class="text-gold font-bold hover:underline">إنشاء حساب</button>
            </p>
            <p id="auth-msg" class="text-center text-xs font-bold mt-2"></p>
        </div>
    </div>

    <!-- 4. تتبع الطلب (Tracking) -->
    <div id="tracking-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-80 opacity-0 pointer-events-none transition-opacity p-4">
        <div class="bg-card w-full max-w-md rounded-2xl shadow-2xl border border-gray-800 p-6 relative">
            <button onclick="document.getElementById('tracking-modal').classList.remove('modal-open')" class="absolute top-2 left-2 text-gray-400 text-2xl">&times;</button>
            <h3 class="text-2xl font-bold gold-text text-center mb-6">تتبع طلبك</h3>
            
            <div class="flex gap-2 mb-6">
                <input type="tel" id="track-phone" placeholder="اكتب رقم تليفونك" class="w-full bg-darker border border-gray-700 rounded-lg p-3 text-white focus:border-gold">
                <button onclick="trackOrder()" class="bg-gold text-dark px-4 rounded-lg font-bold hover:bg-yellow-500">بحث</button>
            </div>
            
            <div id="tracking-result" class="hidden space-y-3"></div>
        </div>
    </div>

    <!-- 5. التقييمات (Reviews Modal) -->
    <div id="reviews-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-80 opacity-0 pointer-events-none transition-opacity p-4">
        <div class="bg-card w-full max-w-lg rounded-2xl shadow-2xl border border-gray-800 overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-darker p-4 flex justify-between items-center">
                <h3 class="text-xl font-bold gold-text">التقييمات</h3>
                <button onclick="document.getElementById('reviews-modal').classList.remove('modal-open')" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto">
                <!-- إضافة تقييم -->
                <form onsubmit="submitReview(event)" class="mb-6 bg-darker p-4 rounded-lg border border-gray-800">
                    <input type="hidden" id="review-product-id">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="text-sm font-bold">تقييمك:</span>
                        <select id="review-rating" required class="bg-gray-800 text-gold font-bold p-1 rounded outline-none">
                            <option value="5">⭐⭐⭐⭐⭐ (5)</option>
                            <option value="4">⭐⭐⭐⭐ (4)</option>
                            <option value="3">⭐⭐⭐ (3)</option>
                            <option value="2">⭐⭐ (2)</option>
                            <option value="1">⭐ (1)</option>
                        </select>
                    </div>
                    <input type="text" id="review-name" placeholder="اسمك" required class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white text-sm mb-2">
                    <textarea id="review-comment" placeholder="اكتب رأيك..." required class="w-full bg-gray-800 border border-gray-700 rounded p-2 text-white text-sm mb-2"></textarea>
                    <button type="submit" class="bg-gold text-black font-bold py-2 px-4 rounded text-sm">إرسال التقييم</button>
                </form>
                
                <!-- قائمة التقييمات -->
                <div id="reviews-list" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://icmvrjmkcyjuoxekvvfw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_M05JYZ9LKlIfeDjuCJqzxQ_Ay6EbRKj';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let allProducts = [];
        let appliedDiscount = 0;
        let currentUser = null;
        let isSignUpMode = false;

        // 1. التهيئة
        async function initPage() {
            // سحب الإعدادات
            const { data: settings } = await supabaseClient.from('settings').select('*').eq('id', 1).single();
            if (settings) {
                document.getElementById('site-name').innerText = settings.site_name || 'عطور الشرق';
                document.getElementById('footer-name').innerText = settings.site_name || 'عطور الشرق';
                document.getElementById('hero-title').innerText = settings.hero_title || 'اكتشف عطرك المميز';
                document.getElementById('hero-subtitle').innerText = settings.hero_subtitle || '';
                if(settings.hero_image) document.getElementById('hero-bg').style.backgroundImage = `url('${settings.hero_image}')`;
                
                const waBtn = document.getElementById('whatsapp-btn');
                if(settings.whatsapp_number) {
                    waBtn.href = `https://wa.me/${settings.whatsapp_number}`;
                    waBtn.classList.remove('hidden');
                }

                const socialDiv = document.getElementById('social-links');
                socialDiv.innerHTML = '';
                if(settings.facebook_url) socialDiv.innerHTML += `<a href="${settings.facebook_url}" target="_blank" class="hover:text-blue-500"><i class="fa-brands fa-facebook"></i></a>`;
                if(settings.instagram_url) socialDiv.innerHTML += `<a href="${settings.instagram_url}" target="_blank" class="hover:text-pink-500"><i class="fa-brands fa-instagram"></i></a>`;
            }

            // سحب المنتجات
            const { data: products } = await supabaseClient.from('products').select('*');
            if(products) {
                allProducts = products;
                renderProducts();
            }
            
            checkSession();
        }

        // 2. المصادقة (حسابي)
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('user-name-display').innerText = "حسابي";
                document.getElementById('auth-btn').onclick = openUserDashboard; // تفتح لوحة العميل
            } else {
                currentUser = null;
                document.getElementById('user-name-display').innerText = "دخول";
                document.getElementById('auth-btn').onclick = openAuthModal;
            }
        }

        function openAuthModal() { document.getElementById('auth-modal').classList.add('modal-open'); }
        
        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-title').innerText = isSignUpMode ? 'إنشاء حساب' : 'تسجيل دخول';
            document.getElementById('name-field').classList.toggle('hidden', !isSignUpMode);
            document.getElementById('auth-submit-btn').innerText = isSignUpMode ? 'إنشاء' : 'دخول';
            document.getElementById('auth-toggle-text').innerText = isSignUpMode ? 'لديك حساب؟' : 'معندكش حساب؟';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const msg = document.getElementById('auth-msg');
            msg.innerText = 'جاري التحميل...'; msg.className = 'text-gold text-center text-xs mt-2';

            if (isSignUpMode) {
                const name = document.getElementById('auth-name').value;
                const { error } = await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: name } } });
                if (error) { msg.innerText = error.message; msg.className = 'text-red-500 text-center text-xs mt-2'; } 
                else { msg.innerText = 'تم إنشاء الحساب! جاري الدخول...'; msg.className = 'text-green-500 text-center text-xs mt-2'; setTimeout(() => document.getElementById('auth-modal').classList.remove('modal-open'), 1500); checkSession(); }
            } else {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) { msg.innerText = 'بيانات الدخول خاطئة'; msg.className = 'text-red-500 text-center text-xs mt-2'; } 
                else { document.getElementById('auth-modal').classList.remove('modal-open'); checkSession(); }
            }
        }

        // 3. تتبع الطلبات
        function openTrackingModal() { document.getElementById('tracking-modal').classList.add('modal-open'); }

        async function trackOrder() {
            const phone = document.getElementById('track-phone').value;
            if(!phone) return alert('اكتب رقم الهاتف');
            
            const resultDiv = document.getElementById('tracking-result');
            resultDiv.innerHTML = '<p class="text-center text-gray-400">جاري البحث...</p>';
            resultDiv.classList.remove('hidden');

            const { data: orders, error } = await supabaseClient.from('orders').select('*').eq('phone', phone).order('created_at', { ascending: false }).limit(1);
            
            if (!orders || orders.length === 0) {
                resultDiv.innerHTML = '<p class="text-center text-red-500 font-bold">مفيش طلبات بالرقم ده!</p>';
                return;
            }

            const order = orders[0];
            let statusText = order.status === 'pending' ? 'قيد التجهيز' : order.status === 'shipped' ? 'تم الشحن' : 'تم التسليم';
            let statusColor = order.status === 'pending' ? 'text-yellow-500' : order.status === 'shipped' ? 'text-blue-500' : 'text-green-500';

            resultDiv.innerHTML = `
                <div class="bg-darker p-4 rounded-lg border border-gray-800 text-center">
                    <p class="text-gray-400 text-sm mb-1">حالة الطلب رقم #${order.id}:</p>
                    <p class="text-2xl font-bold ${statusColor} mb-2">${statusText}</p>
                    <p class="text-sm text-gray-300">الإجمالي: <strong class="text-gold">${order.total_price} ج.م</strong></p>
                    ${order.shipping_company ? `<p class="text-xs text-gray-400 mt-2">شركة الشحن: ${order.shipping_company}</p>` : ''}
                    ${order.tracking_number ? `<p class="text-xs text-gray-400">رقم التتبع: <span class="text-blue-400" dir="ltr">${order.tracking_number}</span></p>` : ''}
                </div>
            `;
        }

        // 4. المنتجات والتقييمات
        function renderProducts() {
            const searchText = document.getElementById('search-input').value.toLowerCase();
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '';

            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(searchText) || p.brand.toLowerCase().includes(searchText));

            filtered.forEach(product => {
                const isOutOfStock = product.stock <= 0;
                grid.innerHTML += `
                    <div class="bg-card rounded-2xl border border-gray-800 overflow-hidden hover:border-gold transition group flex flex-col ${isOutOfStock ? 'opacity-70' : ''}">
                        <div class="relative overflow-hidden h-60">
                            <img src="${product.image_url}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                            <div class="absolute top-4 right-4 bg-black/70 px-3 py-1 rounded-full text-xs font-bold text-gold">${product.brand}</div>
                            ${isOutOfStock ? '<div class="absolute inset-0 bg-black/60 flex items-center justify-center"><span class="bg-red-600 px-4 py-2 rounded font-bold text-white">نفذت الكمية</span></div>' : ''}
                        </div>
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <h4 class="text-xl font-bold mb-1 gold-text truncate">${product.name}</h4>
                                <p class="text-gray-400 text-xs mb-3 truncate">${product.notes}</p>
                                <button onclick="openReviews(${product.id}, '${product.name}')" class="text-xs text-blue-400 hover:text-blue-300 font-bold mb-3 flex items-center gap-1"><i class="fa-solid fa-star text-yellow-500"></i> التقييمات</button>
                            </div>
                            <div class="flex justify-between items-center mt-2">
                                <span class="text-white font-bold text-xl">${product.price} <span class="text-xs text-gray-500">ج.م</span></span>
                                <button onclick="addToCart(${product.id}, '${product.name}', ${product.price})" ${isOutOfStock ? 'disabled' : ''} class="bg-darker border border-gray-700 text-gold px-4 py-1.5 rounded-lg hover:bg-gold hover:text-dark transition font-bold text-sm ${isOutOfStock ? 'cursor-not-allowed' : ''}">أضف</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
        document.getElementById('search-input').addEventListener('input', renderProducts);

        async function openReviews(productId, productName) {
            document.getElementById('reviews-modal').classList.add('modal-open');
            document.getElementById('review-product-id').value = productId;
            if(currentUser) document.getElementById('review-name').value = currentUser.user_metadata.full_name || '';
            
            const listDiv = document.getElementById('reviews-list');
            listDiv.innerHTML = '<p class="text-center text-gray-500 text-sm">جاري التحميل...</p>';

            const { data: reviews } = await supabaseClient.from('reviews').select('*').eq('product_id', productId).eq('status', 'approved').order('created_at', { ascending: false });
            
            if(!reviews || reviews.length === 0) {
                listDiv.innerHTML = '<p class="text-center text-gray-500 text-sm">لا يوجد تقييمات بعد. كن أول من يقيم!</p>';
                return;
            }

            listDiv.innerHTML = reviews.map(r => `
                <div class="border-b border-gray-800 pb-3">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-sm text-gray-300">${r.customer_name}</span>
                        <span class="text-yellow-500 text-xs">${'⭐'.repeat(r.rating)}</span>
                    </div>
                    <p class="text-gray-400 text-sm">${r.comment}</p>
                </div>
            `).join('');
        }

        async function submitReview(e) {
            e.preventDefault();
            const pId = document.getElementById('review-product-id').value;
            const data = {
                product_id: pId,
                rating: parseInt(document.getElementById('review-rating').value),
                customer_name: document.getElementById('review-name').value,
                comment: document.getElementById('review-comment').value,
                user_id: currentUser ? currentUser.id : null
            };
            const { error } = await supabaseClient.from('reviews').insert([data]);
            if(error) alert('حدث خطأ!');
            else { 
                alert('شكراً لتقييمك! سيظهر بعد المراجعة.'); 
                document.getElementById('review-comment').value = ''; 
            }
        }

        // --- السلة والطلب ---
        // (نفس الأكواد السابقة، اختصرتها هنا عشان الطول، تأكد إنها موجودة زي ما هي)
        function addToCart(id, name, price) {
            const existing = cart.find(item => item.id === id);
            if (existing) { existing.qty += 1; } else { cart.push({ id, name, price, qty: 1 }); }
            saveCart(); toggleCart();
        }
        function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); updateCartUI(); }
        function updateCartUI() {
            const totalCount = cart.reduce((total, item) => total + item.qty, 0);
            document.getElementById('cart-count').innerText = totalCount;
            const cartItemsDiv = document.getElementById('cart-items');
            let totalPrice = 0;
            if (cart.length === 0) { cartItemsDiv.innerHTML = '<p class="text-center text-gray-500 mt-10">السلة فارغة</p>'; document.getElementById('cart-total').innerText = '0 ج.م'; return; }
            cartItemsDiv.innerHTML = '';
            cart.forEach((item, index) => {
                totalPrice += item.price * item.qty;
                cartItemsDiv.innerHTML += `<div class="flex justify-between items-center border-b border-gray-800 pb-4 mb-4"><div><p class="font-bold text-white">${item.name}</p><p class="text-sm text-gold">${item.price} × ${item.qty}</p></div><button onclick="removeFromCart(${index})" class="text-red-500 font-bold text-sm">حذف</button></div>`;
            });
            let discountAmount = (totalPrice * appliedDiscount) / 100;
            document.getElementById('cart-total').innerText = (totalPrice - discountAmount).toFixed(0) + ' ج.م';
            if(appliedDiscount > 0) { document.getElementById('discount-row').classList.remove('hidden'); document.getElementById('discount-amount').innerText = discountAmount.toFixed(0) + ' ج.م'; } else { document.getElementById('discount-row').classList.add('hidden'); }
        }
        function removeFromCart(index) { cart.splice(index, 1); saveCart(); }
        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('cart-open'); document.getElementById('overlay').classList.toggle('hidden'); }
        function openCheckoutModal() { if (cart.length === 0) return alert('السلة فارغة!'); document.getElementById('checkout-modal').classList.add('modal-open'); document.getElementById('cart-sidebar').classList.remove('cart-open'); document.getElementById('overlay').classList.add('hidden'); }
        function closeCheckoutModal() { document.getElementById('checkout-modal').classList.remove('modal-open'); }
        async function applyCoupon() {
            const code = document.getElementById('coupon-input').value.trim().toUpperCase();
            const { data } = await supabaseClient.from('coupons').select('*').eq('code', code).eq('active', true).single();
            if(data) { appliedDiscount = data.discount_percent; document.getElementById('coupon-msg').innerText = `خصم ${appliedDiscount}%`; document.getElementById('coupon-msg').className = 'text-green-500 text-xs mb-2'; updateCartUI(); }
            else { appliedDiscount = 0; document.getElementById('coupon-msg').innerText = 'كود غير صحيح'; document.getElementById('coupon-msg').className = 'text-red-500 text-xs mb-2'; updateCartUI(); }
        }
        async function submitOrder(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn'); btn.innerText = 'جاري...'; btn.disabled = true;
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const finalTotal = totalPrice - ((totalPrice * appliedDiscount) / 100);
            const orderData = {
                customer_name: document.getElementById('customer_name').value,
                phone: document.getElementById('phone').value,
                city: document.getElementById('city').value,
                address: document.getElementById('address').value,
                total_price: finalTotal,
                items: cart,
                user_id: currentUser ? currentUser.id : null
            };
            const { error } = await supabaseClient.from('orders').insert([orderData]);
            if (error) { alert('خطأ!'); btn.innerText = 'تأكيد'; btn.disabled = false; return; }
            alert('تم استلام طلبك!'); cart = []; appliedDiscount = 0; saveCart(); closeCheckoutModal(); document.getElementById('checkout-form').reset(); btn.innerText = 'تأكيد'; btn.disabled = false;
        }

        // الزيارات
        async function logVisit() {
            const lastVisit = sessionStorage.getItem('lastVisit');
            if (!lastVisit || Date.now() - lastVisit > 30 * 60 * 1000) { await supabaseClient.from('visits').insert([{}]); sessionStorage.setItem('lastVisit', Date.now()); }
        }

        initPage(); updateCartUI(); logVisit();
    </script>
</body>
</html>
