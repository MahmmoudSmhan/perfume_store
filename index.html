<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELECT | الفخامة والتميز</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- خطوط مينيمال -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = { 
            theme: { 
                extend: { 
                    colors: { 
                        brandBlack: '#111111',
                        brandWhite: '#FFFFFF',
                        brandGray: '#F5F5F5',
                        brandBorder: '#E5E5E5'
                    }, 
                    fontFamily: { 
                        cairo: ['Cairo', 'sans-serif'], 
                        montserrat: ['Montserrat', 'sans-serif'] 
                    } 
                } 
            } 
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #FFFFFF; color: #111111; scroll-behavior: smooth;}
        .brand-title { font-family: 'Montserrat', sans-serif; font-weight: 800; letter-spacing: 2px; }
        
        /* نوافذ وأزرار */
        .cart-open { transform: translateX(0) !important; }
        .modal-open { opacity: 1 !important; pointer-events: auto !important; }
        .modal-content { transform: translateY(0) scale(1) !important; }
        
        /* شريط تنقل أبيض زجاجي */
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #E5E5E5; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #F5F5F5; }
        ::-webkit-scrollbar-thumb { background: #111111; border-radius: 10px; }

        #toast { visibility: hidden; min-width: 250px; background-color: #111111; color: #FFFFFF; text-align: center; border-radius: 0px; padding: 16px 24px; position: fixed; z-index: 100; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; opacity: 0; transition: all 0.5s ease; }
        #toast.show { visibility: visible; opacity: 1; bottom: 40px; }
        
        .hover-lift { transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .hover-lift:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    </style>
</head>
<body class="relative min-h-screen flex flex-col">

    <div id="toast">تمت العملية بنجاح!</div>

    <!-- شريط التنقل -->
    <nav class="glass-nav py-4 sticky top-0 z-40 transition-all duration-300">
        <div class="container mx-auto px-6 flex justify-between items-center">
            
            <!-- اللوجو والاسم -->
            <div class="flex items-center gap-4 cursor-pointer" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
                <!-- لو اللوجو متحمل من الأدمن هيظهر هنا -->
                <img id="site-logo" src="" class="h-10 object-contain hidden" alt="SELECT Logo">
                <!-- لو مفيش لوجو، هيظهر النص ده -->
                <h1 id="site-name" class="text-2xl brand-title text-brandBlack">SELECT</h1>
            </div>
            
            <div class="hidden md:flex items-center gap-10">
                <a href="#" id="nav-home" class="text-sm font-bold text-gray-500 hover:text-brandBlack transition-colors">الرئيسية</a>
                <a href="#products" id="nav-shop" class="text-sm font-bold text-gray-500 hover:text-brandBlack transition-colors">المتجر</a>
            </div>

            <div class="flex items-center gap-6">
                <button onclick="openTrackingModal()" class="text-sm font-bold text-gray-500 hover:text-brandBlack transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-truck-fast"></i> <span id="nav-track" class="hidden md:inline">تتبع طلبك</span>
                </button>

                <div class="relative cursor-pointer group" onclick="toggleCart()">
                    <span class="text-xl text-brandBlack group-hover:text-gray-500 transition-colors"><i class="fa-solid fa-bag-shopping"></i></span>
                    <span id="cart-count" class="absolute -top-2 -right-2 bg-brandBlack text-white text-[11px] font-bold w-5 h-5 flex items-center justify-center rounded-full">0</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- البانر (Hero) -->
    <header class="relative bg-brandGray text-center py-32 px-4 overflow-hidden border-b border-brandBorder flex items-center justify-center min-h-[70vh]">
        <div id="hero-bg" class="absolute inset-0 bg-cover bg-center opacity-60 transition-transform duration-[20s] hover:scale-105" style="background-image: url('https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=2070&auto=format&fit=crop');"></div>
        <div class="absolute inset-0 bg-white/40 mix-blend-overlay"></div>
        
        <div class="relative z-10 max-w-4xl mx-auto flex flex-col items-center bg-white/80 backdrop-blur-md p-12 border border-brandBorder shadow-xl">
            <h2 id="hero-title" class="text-5xl md:text-7xl brand-title text-brandBlack mb-6 uppercase">اكتشف عطرك المميز</h2>
            <p id="hero-subtitle" class="text-gray-600 text-lg md:text-xl mb-12 max-w-2xl mx-auto font-medium leading-relaxed">نقدم لك أفخم العطور الشرقية والفرنسية.</p>
            <button onclick="document.getElementById('products').scrollIntoView({behavior: 'smooth'})" id="hero-btn" class="bg-brandBlack text-white px-12 py-4 font-bold text-sm tracking-widest uppercase hover:bg-gray-800 transition duration-300">تسوق الآن</button>
        </div>
    </header>

    <!-- المتجر -->
    <main class="container mx-auto py-24 px-6 flex-grow" id="products">
        
        <!-- شريط الفلترة -->
        <div class="flex flex-col lg:flex-row justify-between items-center gap-8 mb-16 pb-6 border-b border-brandBorder">
            <div class="flex flex-wrap justify-center gap-4 w-full lg:w-auto">
                <button onclick="filterCategory('all')" class="cat-btn bg-brandBlack text-white px-8 py-2.5 font-bold text-sm transition">الكل</button>
                <button onclick="filterCategory('men')" class="cat-btn bg-transparent text-gray-600 border border-brandBorder px-8 py-2.5 font-bold text-sm hover:border-brandBlack hover:text-brandBlack transition">رجالي</button>
                <button onclick="filterCategory('women')" class="cat-btn bg-transparent text-gray-600 border border-brandBorder px-8 py-2.5 font-bold text-sm hover:border-brandBlack hover:text-brandBlack transition">نسائي</button>
                <button onclick="filterCategory('unisex')" class="cat-btn bg-transparent text-gray-600 border border-brandBorder px-8 py-2.5 font-bold text-sm hover:border-brandBlack hover:text-brandBlack transition">للجنسين</button>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-4 w-full lg:w-auto">
                <div class="relative w-full sm:w-72">
                    <input type="text" id="search-input" placeholder="ابحث عن عطر..." class="w-full bg-brandGray text-brandBlack border border-transparent py-3 px-6 focus:outline-none focus:border-brandBlack transition-colors">
                    <i class="fa-solid fa-magnifying-glass absolute left-5 top-4 text-gray-400"></i>
                </div>
                <select id="price-filter" onchange="renderProducts()" class="bg-brandGray border border-transparent text-gray-600 py-3 px-6 focus:outline-none focus:border-brandBlack outline-none cursor-pointer appearance-none">
                    <option value="all">السعر: الكل</option>
                    <option value="low">أقل من 500 ج.م</option>
                    <option value="mid">من 500 إلى 1000 ج.م</option>
                    <option value="high">أكثر من 1000 ج.م</option>
                </select>
            </div>
        </div>

        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-10"></div>
    </main>

    <!-- التقييمات -->
    <section class="bg-brandGray py-20 border-t border-brandBorder">
        <div class="container mx-auto px-6">
            <div class="text-center mb-12">
                <h3 class="text-3xl brand-title text-brandBlack uppercase">آراء العملاء</h3>
                <div class="w-16 h-[2px] bg-brandBlack mx-auto mt-4"></div>
            </div>
            <div id="latest-reviews-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        </div>
    </section>

    <!-- الفوتر -->
    <footer class="bg-white border-t border-brandBorder py-12 mt-auto">
        <div class="container mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="flex flex-col items-center md:items-start gap-2">
                <h2 class="text-xl brand-title text-brandBlack">SELECT</h2>
                <p class="text-gray-400 text-sm"><span id="footer-text">جميع الحقوق محفوظة</span> &copy; 2024 <span id="footer-name"></span></p>
            </div>
            <div id="social-links" class="flex gap-6 text-xl text-gray-400"></div>
        </div>
    </footer>

    <!-- زرار واتساب -->
    <a id="whatsapp-btn" href="#" target="_blank" class="hidden fixed bottom-8 right-8 bg-brandBlack text-white w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-xl hover:scale-110 transition-transform z-40"><i class="fa-brands fa-whatsapp"></i></a>

    <!-- ==================== النوافذ المنبثقة ==================== -->

    <!-- السلة -->
    <div id="overlay" class="fixed inset-0 bg-white/60 backdrop-blur-sm z-40 hidden transition-opacity" onclick="toggleCart()"></div>
    <div id="cart-sidebar" class="fixed inset-y-0 left-0 w-full md:w-[420px] bg-white shadow-2xl transform -translate-x-full transition-transform duration-500 z-50 flex flex-col border-l border-brandBorder">
        <div class="p-6 border-b border-brandBorder flex justify-between items-center">
            <h3 class="text-xl brand-title text-brandBlack">السلة</h3>
            <button onclick="toggleCart()" class="text-gray-400 hover:text-brandBlack transition"><i class="fa-solid fa-xmark text-2xl"></i></button>
        </div>
        <div id="cart-items" class="flex-1 p-6 overflow-y-auto"></div>
        <div class="p-6 border-t border-brandBorder bg-brandGray">
            <div class="flex gap-2 mb-6">
                <input type="text" id="coupon-input" placeholder="كود الخصم" class="w-full bg-white border border-brandBorder p-3 text-sm outline-none focus:border-brandBlack transition uppercase">
                <button onclick="applyCoupon()" class="bg-brandBlack text-white px-6 font-bold text-sm hover:bg-gray-800 transition">تطبيق</button>
            </div>
            <p id="coupon-msg" class="text-xs font-bold mb-3"></p>
            <div class="flex justify-between font-bold text-lg mb-2 text-brandBlack"><span>الإجمالي:</span><span id="cart-total">0 ج.م</span></div>
            <div class="flex justify-between text-sm text-green-600 mb-6 hidden" id="discount-row"><span>الخصم:</span><span id="discount-amount">0 ج.م</span></div>
            <button onclick="openCheckoutModal()" id="btn-checkout-dyn" class="w-full bg-brandBlack text-white font-bold py-4 hover:bg-gray-800 transition text-sm tracking-widest uppercase">إتمام الطلب</button>
        </div>
    </div>

    <!-- فورم الشحن -->
    <div id="checkout-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-white/80 backdrop-blur-md opacity-0 pointer-events-none transition-opacity p-4">
        <div class="bg-white w-full max-w-lg border border-brandBorder shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300 modal-content flex flex-col">
            <div class="p-6 border-b border-brandBorder flex justify-between items-center bg-brandGray"><h3 class="text-xl brand-title text-brandBlack">بيانات الشحن</h3><button onclick="closeCheckoutModal()" class="text-gray-400 hover:text-brandBlack transition"><i class="fa-solid fa-xmark text-2xl"></i></button></div>
            <div class="p-8">
                <form id="checkout-form" onsubmit="submitOrder(event)" class="space-y-5">
                    <div><label class="block text-sm font-bold text-gray-500 mb-2">الاسم بالكامل</label><input type="text" id="customer_name" required class="w-full bg-brandGray border border-transparent p-4 text-brandBlack focus:border-brandBlack outline-none transition"></div>
                    <div><label class="block text-sm font-bold text-gray-500 mb-2">رقم الهاتف</label><input type="tel" id="phone" required class="w-full bg-brandGray border border-transparent p-4 text-brandBlack focus:border-brandBlack outline-none transition"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-sm font-bold text-gray-500 mb-2">المحافظة</label><input type="text" id="city" required class="w-full bg-brandGray border border-transparent p-4 text-brandBlack focus:border-brandBlack outline-none transition"></div>
                        <div><label class="block text-sm font-bold text-gray-500 mb-2">العنوان</label><input type="text" id="address" required class="w-full bg-brandGray border border-transparent p-4 text-brandBlack focus:border-brandBlack outline-none transition"></div>
                    </div>
                    <button type="submit" id="submit-btn" class="w-full bg-brandBlack text-white font-bold py-4 mt-6 text-sm tracking-widest uppercase hover:bg-gray-800 transition">تأكيد الطلب</button>
                </form>
            </div>
        </div>
    </div>

    <!-- نجاح الطلب -->
    <div id="success-modal" class="fixed inset-0 z-[60] flex items-center justify-center bg-white/95 backdrop-blur-md opacity-0 pointer-events-none transition-opacity p-4">
        <div class="bg-white w-full max-w-md border border-brandBorder shadow-2xl p-10 text-center transform scale-90 transition-transform duration-300 modal-content">
            <div class="w-20 h-20 bg-brandGray text-brandBlack rounded-full flex items-center justify-center mx-auto mb-8 text-4xl"><i class="fa-solid fa-check"></i></div>
            <h3 class="text-2xl brand-title text-brandBlack mb-3">تم استلام طلبك</h3>
            <p class="text-gray-500 text-sm mb-10 leading-relaxed">شكراً لثقتك بنا. سنتواصل معك قريباً لتأكيد الشحن.</p>
            <button onclick="document.getElementById('success-modal').classList.remove('modal-open')" class="w-full bg-brandBlack text-white font-bold py-4 text-sm tracking-widest uppercase hover:bg-gray-800 transition">حسناً، شكراً</button>
        </div>
    </div>

    <!-- تتبع -->
    <div id="tracking-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-white/80 backdrop-blur-md opacity-0 pointer-events-none transition-opacity p-4">
        <div class="bg-white w-full max-w-md border border-brandBorder shadow-2xl p-8 relative modal-content">
            <button onclick="document.getElementById('tracking-modal').classList.remove('modal-open')" class="absolute top-6 left-6 text-gray-400 hover:text-brandBlack transition"><i class="fa-solid fa-xmark text-2xl"></i></button>
            <div class="text-center mb-8"><h3 class="text-xl brand-title text-brandBlack">تتبع الطلب</h3></div>
            <div class="flex flex-col gap-4 mb-6">
                <input type="tel" id="track-phone" placeholder="أدخل رقم الهاتف" class="w-full bg-brandGray border border-transparent p-4 text-brandBlack text-center focus:border-brandBlack outline-none transition">
                <button onclick="trackOrder()" class="w-full bg-brandBlack text-white py-4 font-bold text-sm tracking-widest uppercase hover:bg-gray-800 transition">بحث</button>
            </div>
            <div id="tracking-result" class="hidden space-y-4"></div>
        </div>
    </div>

    <!-- تقييم -->
    <div id="reviews-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-white/80 backdrop-blur-md opacity-0 pointer-events-none transition-opacity p-4">
        <div class="bg-white w-full max-w-lg border border-brandBorder shadow-2xl overflow-hidden flex flex-col modal-content">
            <div class="p-6 border-b border-brandBorder flex justify-between items-center bg-brandGray">
                <h3 class="text-xl brand-title text-brandBlack">أضف تقييمك</h3>
                <button onclick="document.getElementById('reviews-modal').classList.remove('modal-open')" class="text-gray-400 hover:text-brandBlack"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            <div class="p-8">
                <form onsubmit="submitReview(event)" class="space-y-5">
                    <input type="hidden" id="review-product-id">
                    <div>
                        <label class="block text-sm font-bold text-gray-500 mb-2">تقييمك</label>
                        <select id="review-rating" required class="w-full bg-brandGray text-brandBlack font-bold p-4 outline-none border border-transparent focus:border-brandBlack">
                            <option value="5">⭐⭐⭐⭐⭐ ممتاز</option><option value="4">⭐⭐⭐⭐ جيد جداً</option><option value="3">⭐⭐⭐ جيد</option><option value="2">⭐⭐ مقبول</option><option value="1">⭐ سيء</option>
                        </select>
                    </div>
                    <div><label class="block text-sm font-bold text-gray-500 mb-2">اسمك</label><input type="text" id="review-name" required class="w-full bg-brandGray border border-transparent p-4 text-brandBlack outline-none focus:border-brandBlack transition"></div>
                    <div><label class="block text-sm font-bold text-gray-500 mb-2">رأيك</label><textarea id="review-comment" required class="w-full bg-brandGray border border-transparent p-4 text-brandBlack outline-none focus:border-brandBlack transition" rows="3"></textarea></div>
                    <button type="submit" class="w-full bg-brandBlack text-white font-bold py-4 text-sm tracking-widest uppercase hover:bg-gray-800 transition mt-4">إرسال</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://icmvrjmkcyjuoxekvvfw.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_M05JYZ9LKlIfeDjuCJqzxQ_Ay6EbRKj';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let allProducts = [], allReviews = [], appliedDiscount = 0, dynamicTexts = {}, currentFilter = 'all';

        const badWords = ['كسم', 'خرا', 'زبالة', 'حيوان', 'غبي', 'عبيط', 'كلب', 'عرص', 'شرموط', 'قحب', 'خول', 'لبوة', 'طيز', 'كس', 'نيك', 'متناك', 'شرموطة', 'fuck', 'shit', 'bitch', 'asshole', 'pussy'];
        function censorText(text) {
            if (!text) return '';
            let clean = text;
            badWords.forEach(word => { const regex = new RegExp(word, 'gi'); clean = clean.replace(regex, '***'); });
            return clean;
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg; toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }

        async function initPage() {
            const { data: settings } = await supabaseClient.from('settings').select('*').eq('id', 1).single();
            if (settings) {
                dynamicTexts = settings; 
                document.getElementById('site-name').innerText = censorText(settings.site_name) || 'SELECT';
                document.getElementById('footer-name').innerText = censorText(settings.site_name) || 'SELECT';
                
                if(settings.logo_url) {
                    const logoImg = document.getElementById('site-logo');
                    logoImg.src = settings.logo_url;
                    logoImg.classList.remove('hidden');
                    document.getElementById('site-name').classList.add('hidden'); // نخفي النص لو اللوجو موجود
                }

                document.getElementById('hero-title').innerText = censorText(settings.hero_title) || 'اكتشف عطرك المميز';
                document.getElementById('hero-subtitle').innerText = censorText(settings.hero_subtitle) || '';
                document.getElementById('nav-home').innerText = settings.nav_home || 'الرئيسية';
                document.getElementById('nav-shop').innerText = settings.nav_shop || 'المتجر';
                document.getElementById('nav-track').innerText = settings.nav_track || 'تتبع طلبك';
                document.getElementById('hero-btn').innerText = censorText(settings.hero_btn) || 'تسوق الآن';
                document.getElementById('btn-checkout-dyn').innerText = censorText(settings.btn_checkout) || 'إتمام الطلب';
                document.getElementById('footer-text').innerText = censorText(settings.footer_text) || 'جميع الحقوق محفوظة';

                if(settings.hero_image) document.getElementById('hero-bg').style.backgroundImage = `url('${settings.hero_image}')`;
                
                const waBtn = document.getElementById('whatsapp-btn');
                if(settings.whatsapp_number) { waBtn.href = `https://wa.me/${settings.whatsapp_number}`; waBtn.classList.remove('hidden'); }

                const socialDiv = document.getElementById('social-links');
                socialDiv.innerHTML = '';
                if(settings.facebook_url) socialDiv.innerHTML += `<a href="${settings.facebook_url}" target="_blank" class="hover:text-brandBlack transition"><i class="fa-brands fa-facebook"></i></a>`;
                if(settings.instagram_url) socialDiv.innerHTML += `<a href="${settings.instagram_url}" target="_blank" class="hover:text-brandBlack transition"><i class="fa-brands fa-instagram"></i></a>`;
                if(settings.tiktok_url) socialDiv.innerHTML += `<a href="${settings.tiktok_url}" target="_blank" class="hover:text-brandBlack transition"><i class="fa-brands fa-tiktok"></i></a>`;
            }

            const { data: products } = await supabaseClient.from('products').select('*');
            if(products) allProducts = products;
            const { data: reviews } = await supabaseClient.from('reviews').select('*').eq('status', 'approved');
            if(reviews) allReviews = reviews;

            renderProducts(); renderLatestReviews();
        }

        function renderLatestReviews() {
            const container = document.getElementById('latest-reviews-container'); container.innerHTML = '';
            const latest = allReviews.slice(-6).reverse(); 
            if(latest.length === 0) { container.innerHTML = '<p class="text-gray-500 col-span-3 text-center">كن أول من يشاركنا رأيه!</p>'; return; }
            latest.forEach(r => {
                const product = allProducts.find(p => p.id === r.product_id);
                container.innerHTML += `
                <div class="bg-white p-8 border border-brandBorder hover-lift">
                    <div class="flex justify-between items-center mb-4">
                        <span class="font-bold text-brandBlack">${censorText(r.customer_name)}</span>
                        <span class="text-brandBlack text-xs">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span>
                    </div>
                    <p class="text-gray-500 text-sm italic mb-6 leading-relaxed">"${censorText(r.comment)}"</p>
                    <div class="text-xs text-gray-400 border-t border-brandBorder pt-4 flex items-center gap-2"><i class="fa-solid fa-check"></i> اشترى: ${product ? censorText(product.name) : 'منتج'}</div>
                </div>`;
            });
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => { 
                btn.classList.remove('bg-brandBlack', 'text-white', 'border-brandBlack'); 
                btn.classList.add('bg-transparent', 'text-gray-600', 'border-brandBorder'); 
            });
            event.target.classList.remove('bg-transparent', 'text-gray-600', 'border-brandBorder'); 
            event.target.classList.add('bg-brandBlack', 'text-white', 'border-brandBlack');
            renderProducts();
        }

        function renderProducts() {
            const searchText = document.getElementById('search-input').value.toLowerCase();
            const priceFilter = document.getElementById('price-filter').value;
            const grid = document.getElementById('products-grid'); grid.innerHTML = '';

            let filtered = allProducts.filter(p => p.name.toLowerCase().includes(searchText) || p.brand.toLowerCase().includes(searchText));
            if (currentFilter !== 'all') filtered = filtered.filter(p => p.category === currentFilter);
            
            if (priceFilter === 'low') filtered = filtered.filter(p => p.price < 500);
            else if (priceFilter === 'mid') filtered = filtered.filter(p => p.price >= 500 && p.price <= 1000);
            else if (priceFilter === 'high') filtered = filtered.filter(p => p.price > 1000);

            filtered.forEach(product => {
                const isOutOfStock = product.stock <= 0;
                const productReviews = allReviews.filter(r => r.product_id === product.id);
                let ratingHTML = productReviews.length > 0 ? 
                    `<div class="flex items-center gap-1 text-xs text-brandBlack font-bold"><i class="fa-solid fa-star"></i> ${(productReviews.reduce((sum, r) => sum + r.rating, 0) / productReviews.length).toFixed(1)} <span class="text-gray-400 font-normal">(${productReviews.length})</span></div>` : 
                    `<div class="text-xs text-gray-400">لا يوجد تقييمات</div>`;
                
                grid.innerHTML += `
                    <div class="bg-white border border-brandBorder overflow-hidden hover-lift group flex flex-col ${isOutOfStock ? 'opacity-50 grayscale' : ''}">
                        <div class="relative overflow-hidden aspect-[4/5] bg-brandGray">
                            <img src="${product.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
                            <div class="absolute top-4 right-4 bg-white px-3 py-1 text-xs font-bold text-brandBlack border border-brandBorder">${censorText(product.brand)}</div>
                        </div>
                        <div class="p-6 flex-1 flex flex-col justify-between">
                            <div class="mb-4">
                                <h4 class="text-lg font-bold text-brandBlack mb-1">${censorText(product.name)}</h4>
                                ${ratingHTML}
                                <p class="text-gray-500 text-xs mt-2 line-clamp-2">${censorText(product.notes)}</p>
                            </div>
                            <div class="flex justify-between items-center mt-auto pt-4 border-t border-brandBorder">
                                <span class="text-brandBlack font-bold text-xl">${product.price} <span class="text-xs font-normal">ج.م</span></span>
                                <button onclick="addToCart(${product.id}, '${censorText(product.name)}', ${product.price})" ${isOutOfStock ? 'disabled' : ''} class="bg-brandGray text-brandBlack w-10 h-10 flex items-center justify-center hover:bg-brandBlack hover:text-white transition-colors ${isOutOfStock ? 'cursor-not-allowed' : ''}">
                                    <i class="fa-solid fa-plus text-sm"></i>
                                </button>
                            </div>
                        </div>
                    </div>`;
            });
        }
        
        document.getElementById('search-input').addEventListener('input', renderProducts);

        function openReviews(productId) { document.getElementById('reviews-modal').classList.add('modal-open'); document.getElementById('review-product-id').value = productId; }
        async function submitReview(e) {
            e.preventDefault();
            const data = { product_id: parseInt(document.getElementById('review-product-id').value), rating: parseInt(document.getElementById('review-rating').value), customer_name: censorText(document.getElementById('review-name').value), comment: censorText(document.getElementById('review-comment').value) };
            const { error } = await supabaseClient.from('reviews').insert([data]);
            if(error) showToast('حدث خطأ!'); else { showToast('شكراً لتقييمك! سيظهر قريباً.'); document.getElementById('reviews-modal').classList.remove('modal-open'); }
        }

        function openTrackingModal() { document.getElementById('tracking-modal').classList.add('modal-open'); }
        async function trackOrder() {
            const phone = document.getElementById('track-phone').value;
            if(!phone) return showToast('اكتب رقم الهاتف');
            const resultDiv = document.getElementById('tracking-result'); resultDiv.innerHTML = '<p class="text-center text-gray-500">جاري البحث...</p>'; resultDiv.classList.remove('hidden');
            
            const { data: orders } = await supabaseClient.from('orders').select('*').eq('phone', phone).order('created_at', { ascending: false }).limit(1);
            if (!orders || orders.length === 0) { resultDiv.innerHTML = '<p class="text-center text-red-500 font-bold">مفيش طلبات بالرقم ده!</p>'; return; }
            
            const order = orders[0];
            let statusText = order.status === 'pending' ? 'قيد التجهيز' : order.status === 'shipped' ? 'تم الشحن' : order.status === 'cancelled' ? 'ملغي' : 'تم التسليم';
            let statusColor = order.status === 'pending' ? 'text-yellow-600' : order.status === 'shipped' ? 'text-blue-600' : order.status === 'cancelled' ? 'text-red-500' : 'text-green-600';
            let actionButtons = order.status === 'pending' ? `<div class="flex gap-4 mt-6"><button onclick="cancelOrder(${order.id})" class="flex-1 bg-white border border-brandBorder text-red-500 py-3 font-bold text-xs hover:bg-red-50 transition">إلغاء</button><button onclick="reorder(${order.id}, '${phone}')" class="flex-1 bg-brandBlack text-white py-3 font-bold text-xs hover:bg-gray-800 transition">تعديل</button></div>` : '';

            resultDiv.innerHTML = `<div class="bg-brandGray p-6 border border-brandBorder text-center mt-2"><p class="text-gray-500 text-xs mb-2">الطلب #${order.id}</p><p class="text-xl font-bold ${statusColor} mb-3">${statusText}</p><p class="text-sm text-brandBlack">الإجمالي: <strong>${order.total_price} ج.م</strong></p>${actionButtons}</div>`;
        }

        async function cancelOrder(orderId) { if(!confirm('هل أنت متأكد من إلغاء الطلب؟')) return; const { error } = await supabaseClient.from('orders').update({ status: 'cancelled' }).eq('id', orderId); if(!error) { showToast('تم إلغاء الطلب بنجاح'); trackOrder(); } }
        async function reorder(orderId, phone) { const { data: order } = await supabaseClient.from('orders').select('items').eq('id', orderId).single(); if(order && order.items) { cart = order.items; saveCart(); toggleCart(); document.getElementById('tracking-modal').classList.remove('modal-open'); showToast('تم نقل المنتجات للسلة للتعديل'); await supabaseClient.from('orders').update({ status: 'cancelled' }).eq('id', orderId); } }

        function addToCart(id, name, price) { const existing = cart.find(item => item.id === id); if (existing) { existing.qty += 1; } else { cart.push({ id, name, price, qty: 1 }); } saveCart(); toggleCart(); }
        function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); updateCartUI(); }
        function updateCartUI() {
            const totalCount = cart.reduce((total, item) => total + item.qty, 0); document.getElementById('cart-count').innerText = totalCount;
            const cartItemsDiv = document.getElementById('cart-items'); let totalPrice = 0;
            if (cart.length === 0) { cartItemsDiv.innerHTML = '<p class="text-center text-gray-400 mt-10 text-sm">السلة فارغة</p>'; document.getElementById('cart-total').innerText = '0 ج.م'; return; }
            cartItemsDiv.innerHTML = '';
            cart.forEach((item, index) => { totalPrice += item.price * item.qty; cartItemsDiv.innerHTML += `<div class="flex justify-between items-center border-b border-brandBorder pb-5 mb-5"><div><p class="font-bold text-brandBlack text-sm">${censorText(item.name)}</p><p class="text-xs text-gray-500 mt-1">${item.price} ج.م × ${item.qty}</p></div><button onclick="removeFromCart(${index})" class="text-gray-400 hover:text-red-500 transition"><i class="fa-solid fa-xmark"></i></button></div>`; });
            let discountAmount = (totalPrice * appliedDiscount) / 100;
            document.getElementById('cart-total').innerText = (totalPrice - discountAmount).toFixed(0) + ' ج.م';
            if(appliedDiscount > 0) { document.getElementById('discount-row').classList.remove('hidden'); document.getElementById('discount-amount').innerText = discountAmount.toFixed(0) + ' ج.م'; } else { document.getElementById('discount-row').classList.add('hidden'); }
        }
        function removeFromCart(index) { cart.splice(index, 1); saveCart(); }
        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('cart-open'); document.getElementById('overlay').classList.toggle('hidden'); }
        function openCheckoutModal() { if (cart.length === 0) return showToast('السلة فارغة!'); document.getElementById('checkout-modal').classList.add('modal-open'); document.getElementById('cart-sidebar').classList.remove('cart-open'); document.getElementById('overlay').classList.add('hidden'); }
        function closeCheckoutModal() { document.getElementById('checkout-modal').classList.remove('modal-open'); }
        
        async function applyCoupon() { 
            const code = document.getElementById('coupon-input').value.trim().toUpperCase(); 
            const { data } = await supabaseClient.from('coupons').select('*').eq('code', code).eq('active', true).single(); 
            if(data) { appliedDiscount = data.discount_percent; document.getElementById('coupon-msg').innerText = `تم تطبيق خصم ${appliedDiscount}%`; document.getElementById('coupon-msg').className = 'text-green-600 text-xs mb-3 font-bold'; updateCartUI(); } 
            else { appliedDiscount = 0; document.getElementById('coupon-msg').innerText = 'كود الخصم غير صحيح'; document.getElementById('coupon-msg').className = 'text-red-500 text-xs mb-3 font-bold'; updateCartUI(); } 
        }
        
        async function submitOrder(e) { 
            e.preventDefault(); 
            const btn = document.getElementById('submit-btn'); btn.innerText = 'جاري المعالجة...'; btn.disabled = true; 
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0); 
            const finalTotal = totalPrice - ((totalPrice * appliedDiscount) / 100); 
            
            const orderData = { customer_name: censorText(document.getElementById('customer_name').value), phone: document.getElementById('phone').value, city: censorText(document.getElementById('city').value), address: censorText(document.getElementById('address').value), total_price: finalTotal, items: cart, status: 'pending' }; 
            
            const { error } = await supabaseClient.from('orders').insert([orderData]); 
            if (error) { showToast('حدث خطأ!'); btn.innerText = 'تأكيد الطلب'; btn.disabled = false; return; } 
            
            closeCheckoutModal(); document.getElementById('success-modal').classList.add('modal-open');
            cart = []; appliedDiscount = 0; saveCart(); document.getElementById('checkout-form').reset(); btn.innerText = 'تأكيد الطلب'; btn.disabled = false; 
        }
        
        async function logVisit() { const lastVisit = sessionStorage.getItem('lastVisit'); if (!lastVisit || Date.now() - lastVisit > 30 * 60 * 1000) { await supabaseClient.from('visits').insert([{}]); sessionStorage.setItem('lastVisit', Date.now()); } }

        supabaseClient.channel('store-realtime').on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, () => initPage()).on('postgres_changes', { event: '*', schema: 'public', table: 'reviews' }, () => initPage()).on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, () => initPage()).subscribe();

        initPage(); updateCartUI(); logVisit();
    </script>
</body>
</html>
