<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | SELECT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style> 
        body { font-family: 'Tajawal', sans-serif; background-color: #F7F7F7; } 
        .brand-english { font-family: 'Playfair Display', serif; font-weight: 800; letter-spacing: 0.05em; }
        .view-section { display: none; animation: fadeIn 0.3s ease-in-out; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .admin-logo-fix { filter: brightness(0) invert(1); }
    </style>
</head>
<body class="h-screen overflow-hidden flex bg-[#F7F7F7]">

    <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-white/90 backdrop-blur-sm">
        <div class="bg-white p-10 border border-gray-200 shadow-xl w-full max-w-sm">
            <div class="text-center mb-8"><h2 class="text-3xl brand-english text-black">SELECT</h2><p class="text-gray-500 text-sm mt-2">لوحة الإدارة</p></div>
            <form id="login-form" class="space-y-5">
                <input type="email" id="email" placeholder="الإيميل" required class="w-full border-b border-gray-300 p-3 focus:border-black outline-none transition">
                <input type="password" id="password" placeholder="الباسورد" required class="w-full border-b border-gray-300 p-3 focus:border-black outline-none transition">
                <button type="submit" class="w-full bg-black text-white font-bold py-3 hover:bg-gray-800 transition">دخول</button>
            </form>
            <p id="login-error" class="text-red-500 text-center mt-4 hidden text-sm font-bold">بيانات الدخول غير صحيحة!</p>
        </div>
    </div>

    <div id="dashboard" class="hidden w-full h-full flex">
        <aside class="w-72 bg-black text-white flex flex-col shadow-2xl z-20">
            <div class="h-28 flex items-center justify-center border-b border-gray-800 px-6 transition-all duration-300 hover:bg-gray-900">
                <img id="admin-sidebar-logo" src="" class="h-16 object-contain hidden drop-shadow-md admin-logo-fix" alt="Logo">
                <h1 id="admin-sidebar-text" class="text-3xl brand-english text-white tracking-widest">SELECT</h1>
            </div>
            <nav class="flex-1 py-8 space-y-1 overflow-y-auto px-4">
                <button onclick="switchView('overview', this)" class="nav-btn w-full flex items-center px-6 py-4 text-gray-400 hover:bg-gray-900 hover:text-white transition-all"><i class="fa-solid fa-chart-pie w-6 mr-3"></i> نظرة عامة</button>
                <button onclick="switchView('orders', this)" class="nav-btn w-full flex items-center px-6 py-4 text-gray-400 hover:bg-gray-900 hover:text-white transition-all"><i class="fa-solid fa-box w-6 mr-3"></i> الطلبات</button>
                <button onclick="switchView('products', this)" class="nav-btn w-full flex items-center px-6 py-4 text-gray-400 hover:bg-gray-900 hover:text-white transition-all"><i class="fa-solid fa-bottle-droplet w-6 mr-3"></i> المنتجات</button>
                <!-- قسم الباقات الجديد -->
                <button onclick="switchView('bundles', this)" class="nav-btn w-full flex items-center px-6 py-4 text-gray-400 hover:bg-gray-900 hover:text-white transition-all"><i class="fa-solid fa-gift w-6 mr-3"></i> الباقات والعروض</button>
                <button onclick="switchView('reviews', this)" class="nav-btn w-full flex items-center px-6 py-4 text-gray-400 hover:bg-gray-900 hover:text-white transition-all"><i class="fa-solid fa-star w-6 mr-3"></i> التقييمات</button>
                <button onclick="switchView('coupons', this)" class="nav-btn w-full flex items-center px-6 py-4 text-gray-400 hover:bg-gray-900 hover:text-white transition-all"><i class="fa-solid fa-ticket w-6 mr-3"></i> الكوبونات</button>
                <button onclick="switchView('settings', this)" class="nav-btn w-full flex items-center px-6 py-4 text-gray-400 hover:bg-gray-900 hover:text-white transition-all"><i class="fa-solid fa-gear w-6 mr-3"></i> الإعدادات</button>
            </nav>
            <div class="p-6 border-t border-gray-800 space-y-4">
                <a href="index.html" target="_blank" class="flex items-center text-gray-400 hover:text-white font-bold text-sm transition"><i class="fa-solid fa-external-link-alt mr-3"></i> عرض المتجر</a>
                <button onclick="logout()" class="flex items-center text-red-500 hover:text-red-400 font-bold text-sm transition"><i class="fa-solid fa-sign-out-alt mr-3"></i> خروج</button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto p-10">
            <!-- ... (قسم النظرة العامة والطلبات والمنتجات زي ما هو) ... -->
            <div id="view-overview" class="view-section active">...</div>
            <div id="view-orders" class="view-section">...</div>
            <div id="view-products" class="view-section">...</div>

            <!-- 4. Bundles (جديد) -->
            <div id="view-bundles" class="view-section">
                <h2 class="text-2xl font-bold mb-8">الباقات والعروض</h2>
                <div class="bg-white p-6 border border-gray-200 shadow-sm mb-8">
                    <form id="bundle-form" onsubmit="saveBundle(event)" class="flex flex-col md:flex-row gap-4 items-end flex-wrap">
                        <div class="flex-1 w-full min-w-[200px]"><label class="block text-xs font-bold mb-2">اسم الباقة</label><input type="text" id="b-name" required class="w-full border p-2 text-sm bg-gray-50 outline-none"></div>
                        <div class="flex-1 w-full min-w-[150px]"><label class="block text-xs font-bold mb-2">السعر الأصلي</label><input type="number" id="b-original" required class="w-full border p-2 text-sm bg-gray-50 outline-none"></div>
                        <div class="flex-1 w-full min-w-[150px]"><label class="block text-xs font-bold mb-2">سعر الباقة</label><input type="number" id="b-price" required class="w-full border p-2 text-sm bg-gray-50 outline-none"></div>
                        <div class="flex-1 w-full min-w-[150px]"><label class="block text-xs font-bold mb-2">عدد القطع</label><input type="number" id="b-count" required class="w-full border p-2 text-sm bg-gray-50 outline-none"></div>
                        <div class="w-full"><label class="block text-xs font-bold mb-2">صورة الباقة</label><input type="file" id="b-image" accept="image/*" required class="w-full border p-2 text-sm bg-gray-50 outline-none"></div>
                        <button type="submit" class="bg-black text-white px-8 py-2.5 text-sm font-bold h-[42px] w-full md:w-auto">إضافة الباقة</button>
                    </form>
                </div>
                <div id="bundles-list" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
            </div>

            <div id="view-reviews" class="view-section">...</div>
            <div id="view-coupons" class="view-section">...</div>
            <div id="view-settings" class="view-section">...</div>
        </main>
    </div>

    <script>
        // ... (نفس الكود بتاعك السابق، بس هتضيف الدوال دي في الآخر) ...

        async function loadBundles() {
            const { data } = await supabaseClient.from('bundles').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('bundles-list'); list.innerHTML = '';
            if(!data || data.length === 0) { list.innerHTML = '<p class="text-gray-500">لا يوجد باقات حالياً.</p>'; return; }
            
            data.forEach(b => {
                list.innerHTML += `
                <div class="bg-white border border-gray-200 shadow-sm p-4 flex flex-col justify-between">
                    <div class="h-40 bg-gray-100 mb-4 overflow-hidden"><img src="${b.image_url}" class="w-full h-full object-cover"></div>
                    <div>
                        <h3 class="font-bold text-lg text-black">${b.name}</h3>
                        <p class="text-xs text-gray-500 mb-2">تحتوي على ${b.items_count} قطع</p>
                        <div class="flex items-center gap-2 mb-4">
                            <span class="text-gray-400 line-through text-sm">${b.original_price} ج.م</span>
                            <span class="text-green-600 font-bold text-lg">${b.bundle_price} ج.م</span>
                        </div>
                    </div>
                    <button onclick="deleteBundle(${b.id})" class="w-full bg-red-50 text-red-600 font-bold py-2 text-sm hover:bg-red-100 transition"><i class="fa-solid fa-trash mr-2"></i> حذف</button>
                </div>`;
            });
        }

        async function saveBundle(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerText = 'جاري الرفع...'; btn.disabled = true;

            const fileInput = document.getElementById('b-image');
            let imageUrl = '';
            
            if (fileInput.files.length > 0) {
                let file = fileInput.files[0];
                try { file = await imageCompression(file, { maxSizeMB: 0.5, maxWidthOrHeight: 1024, useWebWorker: true }); } catch (error) {}
                const fileName = `bundle-${Date.now()}-${file.name.replace(/\s/g, '_')}`;
                const { error: uploadError } = await supabaseClient.storage.from('product-images').upload(fileName, file);
                if (!uploadError) { const { data: urlData } = supabaseClient.storage.from('product-images').getPublicUrl(fileName); imageUrl = urlData.publicUrl; }
            }

            const bundleData = {
                name: document.getElementById('b-name').value,
                original_price: parseFloat(document.getElementById('b-original').value),
                bundle_price: parseFloat(document.getElementById('b-price').value),
                items_count: parseInt(document.getElementById('b-count').value),
                image_url: imageUrl,
                active: true
            };

            const { error } = await supabaseClient.from('bundles').insert([bundleData]);
            if(error) { alert('حدث خطأ!'); console.error(error); } 
            else { document.getElementById('bundle-form').reset(); loadBundles(); }
            
            btn.innerText = 'إضافة الباقة'; btn.disabled = false;
        }

        async function deleteBundle(id) { 
            if(confirm('حذف الباقة؟')) { await supabaseClient.from('bundles').delete().eq('id', id); loadBundles(); } 
        }
        
        // ضيف loadBundles() جوه دالة loadData
        // وضيف الـ channel listener للـ bundles
    </script>
</body>
</html>
